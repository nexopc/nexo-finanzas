<title>NEXO Finanzas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: una sola columna; Inicio responde 3 preguntas (gastar · ahorro · guardar) con una barra que reparte el total; morado = marca y ahorro, naranja = gastar y registrar */
:root{
  --bg:#F5F2F8; --surface:#FFFFFF; --surface-2:#EEE8F5; --ink:#1D1527; --ink-2:#4E4460; --ink-3:#766B88; --line:#E0D7EB;
  --accent:#6A2BD4; --accent-ink:#FFFFFF; --accent-soft:#ECE3FB; --gold:#B88400;
  --orange:#E8650F; --orange-ink:#FFFFFF; --orange-soft:#FDE8D8; --keep:#8A8198;
  --good:#167F4E; --warn:#A86B00; --bad:#C23B2B; --good-bg:#DDF2E6; --warn-bg:#FBEFD6; --bad-bg:#FBE1DC;
  --s-in:#6A2BD4; --s-out:#E8650F; --s-save:#6A2BD4;
  --fd:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --fb:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#110D17; --surface:#1A1423; --surface-2:#241C30; --ink:#F1EBF8; --ink-2:#C4B9D4; --ink-3:#9186A2; --line:#30263E;
  --accent:#A98BFA; --accent-ink:#1A0B38; --accent-soft:#2C2047; --gold:#E2B33E;
  --orange:#FB8B3E; --orange-ink:#2A1203; --orange-soft:#3A2414; --keep:#9A90AA;
  --good:#45CF8F; --warn:#E4AC3E; --bad:#F27461; --good-bg:#153024; --warn-bg:#33280F; --bad-bg:#3A1C17;
  --s-in:#A98BFA; --s-out:#FB8B3E; --s-save:#A98BFA; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#110D17; --surface:#1A1423; --surface-2:#241C30; --ink:#F1EBF8; --ink-2:#C4B9D4; --ink-3:#9186A2; --line:#30263E;
  --accent:#A98BFA; --accent-ink:#1A0B38; --accent-soft:#2C2047; --gold:#E2B33E;
  --orange:#FB8B3E; --orange-ink:#2A1203; --orange-soft:#3A2414; --keep:#9A90AA;
  --good:#45CF8F; --warn:#E4AC3E; --bad:#F27461; --good-bg:#153024; --warn-bg:#33280F; --bad-bg:#3A1C17;
  --s-in:#A98BFA; --s-out:#FB8B3E; --s-save:#A98BFA; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--fb);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(100px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-width:0}
h1,h2,h3{font-family:var(--fd);text-wrap:balance;margin:0;line-height:1.15}
.num{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.top .sub{color:var(--ink-3);font-size:13px}
.ratepill{display:flex;gap:8px;font-size:12px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 10px;white-space:nowrap}
.banner{background:var(--warn-bg);color:var(--ink);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.banner button{background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card-h h2{font-size:17px;font-weight:600}
.link{color:var(--accent);font-weight:600;font-size:14px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.hero{background:var(--accent);color:var(--accent-ink);border:0}
.hero .eyebrow{color:var(--accent-ink);opacity:.8}
.big{font-family:var(--fd);font-weight:800;font-size:40px;letter-spacing:-.02em;line-height:1}
.hero-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hero-grid div{background:color-mix(in srgb,var(--accent-ink) 12%,transparent);border-radius:12px;padding:10px}
.hero-grid b{display:block;font-family:var(--fd);font-size:17px;font-weight:600}
.hero-grid span{font-size:12px;opacity:.85}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row .grow{flex:1;min-width:0}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.acc-row{padding:10px 0;border-top:1px solid var(--line)}
.acc-row:first-of-type{border-top:0;padding-top:0}
.acc-name{font-weight:600}
.muted{color:var(--ink-3);font-size:13px}
.right{text-align:right}
.amt{font-family:var(--fd);font-weight:600;font-size:17px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--surface-2);color:var(--ink-2)}
.favs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fav{background:var(--surface-2);border-radius:12px;padding:10px 12px;text-align:left;display:flex;gap:10px;align-items:center;min-width:0}
.fav .ic{font-size:22px}
.fav b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav span{font-size:12px;color:var(--ink-3)}
.fav:active{transform:scale(.97)}
.tip{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--surface-2)}
.tip.bad{background:var(--bad-bg)} .tip.warn{background:var(--warn-bg)} .tip.good{background:var(--good-bg)}
.tip .ic{font-size:20px;line-height:1.2}
.tip b{display:block;font-size:14px}
.tip p{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--s-save)}
.hero .bar{background:color-mix(in srgb,var(--accent-ink) 20%,transparent)} .hero .bar i{background:var(--accent-ink)}
.tx{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.tx:first-child{border-top:0}
.tx .ic{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:18px;flex:none}
.pos{color:var(--good)} .neg{color:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{padding:9px 6px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{width:10px;height:10px}
.grid-cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cat{background:var(--surface-2);border:2px solid transparent;border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;line-height:1.15;text-align:center;min-height:74px;justify-content:center}
.cat .ic{font-size:24px}
.cat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-3);padding:6px 0}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.fab{justify-self:center;width:62px;height:62px;border-radius:20px;background:var(--orange);color:var(--orange-ink);display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 18px color-mix(in srgb,var(--orange) 45%,transparent)}
.fab svg{width:30px;height:30px}
#scrim{position:fixed;inset:0;background:rgb(0 0 0/.45);z-index:30}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg);border-radius:22px 22px 0 0;max-height:94dvh;overflow:auto;overscroll-behavior:contain;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 2px}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.sheet-h h2{font-size:20px;font-weight:800}
.x{width:36px;height:36px;border-radius:50%;background:var(--surface-2);font-size:18px}
.amount-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.amount-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.amount-val{font-family:var(--fd);font-weight:800;font-size:38px;letter-spacing:-.02em;line-height:1.05;overflow-wrap:anywhere}
.amount-val.zero{color:var(--ink-3)}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.quick button{background:var(--surface-2);border-radius:10px;padding:10px 2px;font-weight:700;font-size:14px}
.quick button:active{background:var(--accent-soft)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keypad button{background:var(--surface-2);border-radius:10px;padding:13px 0;font-size:20px;font-weight:600;font-family:var(--fd)}
.save{background:var(--orange);color:var(--orange-ink);border-radius:14px;padding:16px;font-weight:700;font-size:17px;width:100%}
.save:disabled{opacity:.45}
.ghost{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-weight:600;font-size:14px}
.danger{color:var(--bad)}
.lbl{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:-6px}
.split{display:flex;flex-direction:column;gap:6px;font-size:13px;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.split .row{justify-content:space-between}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;gap:14px;align-items:center;max-width:min(520px,calc(100% - 32px));font-size:14px;box-shadow:0 8px 24px rgb(0 0 0/.25)}
#toast button{color:var(--accent-soft);font-weight:700;white-space:nowrap}
.list-btn{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.list-btn:first-child{border-top:0}
.list-btn .ic{font-size:20px;width:28px;text-align:center}
.chev{color:var(--ink-3)}
.back{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--accent)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart-detail{font-size:13px;color:var(--ink-2);min-height:20px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend i.line{height:3px;border-radius:2px}
.legend i.dash{height:0;border-top:2px dashed var(--ink-3);background:none!important;width:14px}
.catbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:14px}
.catbar .bar{grid-column:1/-1;height:10px}
.catbar .bar i{background:var(--s-out)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--fd);font-size:19px;font-weight:600}
.stat span{font-size:12px;color:var(--ink-3)}
.goal-items{display:flex;flex-direction:column;gap:6px;font-size:14px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:34px;height:34px;border-radius:10px;background:var(--surface-2);font-weight:700;font-size:18px}
.empty{color:var(--ink-3);font-size:14px;padding:6px 0}
.cardchip{border-radius:12px;padding:12px 14px;color:#fff;display:flex;flex-direction:column;gap:2px;min-width:0}
.cardchip small{opacity:.85}
.fields{display:flex;flex-direction:column;gap:12px}
.note{font-size:12px;color:var(--ink-3)}
.split3{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:3px;background:color-mix(in srgb,var(--accent-ink) 18%,transparent)}
.split3 i{display:block;height:100%;min-width:4px}
.three{gap:0;padding:6px 16px}
.q{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.q .dot{width:14px;height:14px;grid-column:1;grid-row:1}
.q .t{font-weight:700;font-size:16px;grid-column:2;grid-row:1}
.q .v{font-family:var(--fd);font-weight:800;font-size:24px;grid-column:3;grid-row:1;text-align:right;white-space:nowrap}
.q .s{font-size:13px;color:var(--ink-2);grid-column:2/4;grid-row:2}
.q.go .v{color:var(--orange)}
.do{background:var(--orange-soft);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.do .ic{font-size:22px}
.do b{display:block;font-size:15px}
.do p{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.goal{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.goal:first-child{border-top:0}
.goal .bar{height:6px}
@media (prefers-reduced-motion:no-preference){#sheet:not([hidden]){animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
@media (min-width:700px){.big{font-size:46px}}
</style>

<div id="app">
  <header class="top">
    <div><h1 id="hdr-title">NEXO Finanzas</h1><div class="sub" id="hdr-sub"></div></div>

<script>
(()=>{
'use strict';
/* ---------- utilidades ---------- */
const KEY='nexofin.v1', DAY=864e5;
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const today=()=>sod(new Date());
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const ymd=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const pd=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const dDiff=(a,b)=>Math.round((sod(b)-sod(a))/DAY);
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIA=['dom','lun','mar','mié','jue','vie','sáb'];
const fDate=d=>{d=new Date(d);return d.getDate()+' '+MES[d.getMonth()]};
const fTime=ts=>{const d=new Date(ts);return fDate(d)+', '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
const nf0=new Intl.NumberFormat('es-CO',{maximumFractionDigits:0});
const nf1=new Intl.NumberFormat('es-CO',{maximumFractionDigits:1});
const nf2=new Intl.NumberFormat('es-CO',{minimumFractionDigits:2,maximumFractionDigits:2});
const cop=n=>(n<0?'−':'')+'$'+nf0.format(Math.round(Math.abs(n)));
const money=(n,c)=>(!c||c==='COP')?cop(n):(n<0?'−':'')+(c==='USD'?'US$':'€')+nf2.format(Math.abs(n));
const short=n=>{const a=Math.abs(n),s=n<0?'−':'';if(a>=1e6)return s+'$'+nf1.format(a/1e6)+' M';if(a>=1000)return s+'$'+nf0.format(Math.round(a/1000))+' mil';return cop(n)};
const pct=n=>nf0.format(Math.round(n*100))+'%';

const APP_VERSION='1.1.0';
const RATE_MS=3*36e5;

/*FX-START*/
/* Tasas: Coinbase se actualiza varias veces por hora; open.er-api.com (1 vez al día) queda de respaldo */
async function fetchRateData(){
  try{const r=await fetch('https://api.coinbase.com/v2/exchange-rates?currency=USD',{cache:'no-store'});
    if(r.ok){const j=await r.json();const cop=+j.data.rates.COP, eur=+j.data.rates.EUR; if(cop>1000&&eur>0)return {USD:Math.round(cop*100)/100,EUR:Math.round(cop/eur*100)/100,src:'Coinbase'};}}catch(e){}
  try{const r=await fetch('https://open.er-api.com/v6/latest/USD',{cache:'no-store'});
    if(r.ok){const j=await r.json();const cop=+j.rates.COP, eur=+j.rates.EUR; if(cop>1000&&eur>0)return {USD:Math.round(cop*100)/100,EUR:Math.round(cop/eur*100)/100,src:'open.er-api.com'};}}catch(e){}
  return null;
}
function addHistPoint(hist,p){
  if(!p||!(p.USD>0))return hist;
  if(hist.some(x=>Math.abs(x.ts-p.ts)<20*60e3))return hist;
  hist.push({ts:p.ts,USD:p.USD,EUR:p.EUR}); hist.sort((a,b)=>a.ts-b.ts);
  const lim=p.ts-60*864e5; while(hist.length&&(hist[0].ts<lim||hist.length>500))hist.shift();
  return hist;
}
/* Alertas: comparan el precio de ahora con el promedio de los últimos 7 días.
   Solo sugieren comprar lo que necesitas cuando está barato y vender lo que te sobra cuando está caro. */
function fxSignals(hist,sum){
  const out=[], now=Date.now(), day=new Date().toISOString().slice(0,10);
  const n0=v=>'$'+Math.round(v).toLocaleString('es-CO'), p1=v=>(Math.abs(v)*100).toFixed(1).replace('.',',');
  for(const cur of ['USD','EUR']){
    const name=cur==='USD'?'dólar':'euro', sym=cur==='USD'?'US$':'€';
    const fc=v=>sym+v.toLocaleString('es-CO',{minimumFractionDigits:2,maximumFractionDigits:2});
    const pts=hist.filter(p=>p[cur]>0&&p.ts>=now-7*864e5);
    if(pts.length<4||(pts[pts.length-1].ts-pts[0].ts)<2*864e5)continue;
    const last=pts[pts.length-1][cur], avg=pts.reduce((a,p)=>a+p[cur],0)/pts.length, ch=last/avg-1;
    const s=(sum&&sum[cur])||{bal:0,need:0,basis:0};
    if(ch<=-0.015&&s.need>s.bal+0.5){const falta=s.need-s.bal;
      out.push({key:cur+'-compra-'+day,lv:'good',ic:'💱',ti:`El ${name} está ${p1(ch)} % más barato que su promedio de 7 días`,
        tx:`Buen momento para pasar unos ${n0(falta*last)} a ARQ (${fc(falta)}) para tus suscripciones del próximo mes. Compra solo lo que vas a usar.`});}
    else if(ch>=0.015&&s.bal>s.need+1){const sobra=s.bal-s.need, val=sobra*last, cost=s.bal>0?s.basis*sobra/s.bal:0;
      out.push({key:cur+'-venta-'+day,lv:'good',ic:'💱',ti:`El ${name} está ${p1(ch)} % más caro que su promedio de 7 días`,
        tx:`Tienes ${fc(sobra)} que no necesitas para suscripciones. Si los pasas a pesos recibes cerca de ${n0(val)}`+(cost>0?` (te costaron ${n0(cost)}: ${val>=cost?'ganas':'pierdes'} ${n0(Math.abs(val-cost))})`:'')+'. Esa plata puede ir a tus metas.'});}
  }
  return out;
}

function dueDates(inc,from,to){

  let y=from.getFullYear(),m=from.getMonth();
  while(new Date(y,m,1)<=to){const last=new Date(y,m+1,0).getDate();
    const days=inc.freq==='mensual'?[inc.days[0]]:inc.days;
    for(const dd of days){const d=new Date(y,m,Math.min(dd,last));if(d>=from&&d<=to)out.push(d);}
    m++; if(m>11){m=0;y++;}}
  return out.sort((a,b)=>a-b);
}

/* reparto automático de cada ingreso: primero ahorro, luego fijos, el resto para gastar */
function activeGoals(){const eb=envBals();return goals().filter(g=>(+g.share||0)>0&&pd(g.date)>=today()&&(eb[g.id]||0)<goalTarget(g));}
function allocate(amt,kind,until,fixedNeed){
  const alloc={}; const p=(kind==='fijo'?S.set.pctFijo:S.set.pctExtra)/100;
  const gs=activeGoals(); let saveAmt=gs.length?Math.round(amt*p):0;
  const tot=gs.reduce((s,g)=>s+(+g.share),0); let given=0;
  gs.forEach((g,i)=>{const v=i===gs.length-1?saveAmt-given:Math.round(saveAmt*g.share/tot);alloc[g.id]=v;given+=v;});
  let rest=amt-saveAmt;
  const eb=envBals(); const need=fixedNeed!=null?fixedNeed:Math.max(0,subsNeedUntil(until)-Math.max(0,eb.fijos||0));
  const f=Math.min(need,rest); if(f>0)alloc.fijos=f; rest-=f; alloc.gastos=rest;
  return alloc;
}
function payIncomeAt(inc,due,ts,fixedNeed){

/* base en pesos de lo que tienes en dólares/euros */
function fxBasis(acc){let bal=0,basis=0;
  for(const t of [...S.tx].sort((a,b)=>a.t-b.t)){
    const inn=(t.type==='ingreso'||t.type==='ajuste')&&t.acc===acc.id?[t.amount,t.cop]:t.type==='mover'&&t.acc2===acc.id?[t.amount2,t.cop]:null;
    const out=t.type==='gasto'&&t.acc===acc.id?t.amount:t.type==='mover'&&t.acc===acc.id?t.amount:0;
    if(inn){ if(inn[0]<0){basis*=bal>0?Math.max(0,(bal+inn[0])/bal):0;bal+=inn[0];} else {bal+=inn[0];basis+=inn[1];} }
    if(out){basis*=bal>0?Math.max(0,(bal-out)/bal):0;bal-=out;}
  } return {bal,basis};
}

/* lo que tienes y necesitas en cada moneda (para las alertas del dólar/euro) */
function fxSummary(){
  const o={notif:S.set.notif};

    for(const a of S.accounts.filter(a=>a.cur===cur)){const f=fxBasis(a);bal+=Math.max(0,accBal(a.id));basis+=f.basis;}
    let need=0; for(const s of S.subs){if(!s.active)continue;const card=S.cards.find(c=>c.id===s.card);const acc=card&&accById(card.acc);if(acc&&acc.cur===cur)need+=s.cur===cur?s.amount:fromCOP(subCOP(s),cur);}
    o[cur]={bal:r2(bal),need:r2(need),basis:Math.round(basis)};}
  return o;
}

/* ahorro: lo que deberías llevar (regla) vs lo que de verdad tienes */
function savingsAt(until){

function goalPace(g){

  for(const t of S.tx){ if(t.type==='ingreso'&&t.alloc&&t.alloc[g.id]){ if(first==null||t.t<first)first=t.t; if(t.t>=from)got+=t.alloc[g.id]; } }
  if(first==null) return 0;
  const days=Math.max(30,Math.min(90,(Date.now()-first)/DAY));
  return got/days*30.4;
}

/* ---------- consejos ---------- */
function advice(){
  const out=[], t=today(), eb=envBals();
  const dl=dailyLimit();
  for(const inc of S.incomes){const p=pendingDues(inc); if(p.length){const late=dDiff(p[0],t);
    out.push({lv:late>7?'bad':'warn',ic:'⏳',sc:['hoy','semana'],ti:p.length>1?`Te deben ${p.length} pagos de ${inc.name}`:(late>0?`Tu pago del ${fDate(p[0])} va ${late} día${late===1?'':'s'} atrasado`:`Hoy debería llegar tu pago de ${inc.name}`),
      tx:`Mientras no llegue, gasta solo lo de "Para gastar". Cuando llegue, regístralo con un toque y la app lo reparte sola.`});}}
  out.push({lv:dl.left<=0?'bad':dl.left<3000?'warn':'good',ic:'📅',sc:['hoy'],
    ti:dl.left<=0?`Ya pasaste tu límite de hoy (${cop(dl.per)})`:`Hoy puedes gastar hasta ${cop(dl.left)}`,
    tx:dl.late?`Tu pago va atrasado, así que calculé para que tu plata alcance hasta el ${fDate(dl.until)}.`:`Así te alcanza hasta tu próximo pago (${fDate(dl.until)}). Llevas ${cop(dl.spent)} gastados hoy.`});
  for(const x of subsUpcoming(5)){const card=S.cards.find(c=>c.id===x.s.card), acc=card&&accById(card.acc);
    const have=acc?toCOP(accBal(acc.id),acc.cur):0, need=subCOP(x.s);
    out.push({lv:have<need?'bad':x.late?'warn':'info',ic:'💳',sc:['hoy','semana'],
      ti:`${x.s.name}: ${money(x.s.amount,x.s.cur)} ${x.late?'(cobro del '+fDate(x.d)+')':'el '+fDate(x.d)}`,
      tx:have<need?`En ${acc?acc.name:'la cuenta de esa tarjeta'} tienes ${cop(have)}. Recarga al menos ${cop(need-have)} antes de esa fecha.`:`Se cobra a ${card?card.name:'tu tarjeta'}${card&&card.last4?' ••'+card.last4:''}. Hay saldo suficiente.`});}
  for(const m of suggestMoves()){const cash=m.from.id==='efectivo'&&m.to.cur==='COP';
    out.push({lv:'warn',ic:cash?'🏧':'🔄',sc:['hoy','semana'],ti:cash?`Consigna ${cop(m.cop)} de tu efectivo en ${m.to.name}`:`Pasa ${cop(m.cop)} de ${m.from.name} a ${m.to.name}`,
    tx:cash?'Es la parte de tu sueldo que va a tus metas. Consígnala el mismo día del pago, en un corresponsal o punto de recarga, para no gastártela.':`Así cada cuenta queda con lo que le toca según tus apartados.${m.to.cur!=='COP'?' Son unos '+money(fromCOP(m.cop,m.to.cur),m.to.cur)+'.':''}`});}
  for(const f of fxSignals(S.set.rateHist,fxSummary()))out.push({...f,sc:['hoy','semana','mes']});
  for(const cur of ['USD','EUR']){const c=change24(cur);if(c!=null&&Math.abs(c)>=0.01)out.push({lv:'info',ic:c<0?'📉':'📈',sc:['hoy','semana'],ti:`El ${cur==='USD'?'dólar':'euro'} ${c<0?'bajó':'subió'} ${nf1.format(Math.abs(c*100))} % en 24 horas`,tx:`Ahora está en ${cop(R()[cur])}. Las alertas te avisan cuando conviene mover plata; no hace falta que lo revises tú.`});}
  // semana
  const wkStart=addD(t,-((t.getDay()+6)%7)).getTime();
  const wk=S.tx.filter(x=>x.type==='gasto'&&x.env==='gastos'&&x.t>=wkStart).reduce((s,x)=>s+x.cop,0);
  const weekBudget=dl.per*7;
  out.push({lv:wk>weekBudget?'warn':'info',ic:'🗓️',sc:['semana'],ti:`Esta semana llevas ${cop(wk)} en gastos`,tx:`A tu ritmo de ${cop(dl.per)} por día, la semana te da para ${cop(weekBudget)}.`});
  const byCat={}; S.tx.filter(x=>x.type==='gasto'&&x.t>=Date.now()-30*DAY).forEach(x=>byCat[x.cat]=(byCat[x.cat]||0)+x.cop);
  const top=Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0];
  if(top) out.push({lv:'info',ic:CAT(top[0]).ic,sc:['semana','mes'],ti:`Tu gasto más grande del mes: ${CAT(top[0]).name.replace('­','')} (${cop(top[1])})`,
    tx:top[0]==='escolar'?`Son unos ${cop(top[1]/30.4*7)} por semana. Llevar algo de la casa 2 días a la semana te ahorra cerca de ${cop(top[1]*0.4)} al mes.`:'Si lo bajas un 20 %, eso va directo a tus metas.'});
  // mes
  const fixed=monthlyFixed(), subs=subsMonthly();
  if(fixed>0&&subs/fixed>0.2) out.push({lv:subs/fixed>0.35?'bad':'warn',ic:'📺',sc:['mes'],ti:`Tus suscripciones se llevan el ${pct(subs/fixed)} de tu sueldo`,
    tx:`Pagas ${cop(subs)} al mes en suscripciones. Lo sano es menos del 10 %. Cancela una o compártela (plan familiar) y súmale esa plata a NEXO PC.`});
  for(const g of goals()){ const target=goalTarget(g); if(!target) continue; const have=Math.max(0,eb[g.id]||0); if(have>=target){out.push({lv:'good',ic:g.ic,sc:['mes'],ti:`¡Meta ${g.name} completa!`,tx:'Pon su porcentaje en 0 para que tu ahorro vaya a las demás.'});continue;}
    const months=Math.max(0.5,dDiff(t,pd(g.date))/30.4), need=(target-have)/months, pace=goalPace(g);
    const yrs=pace>0?(target-have)/pace/12:Infinity;
    out.push({lv:pace>=need?'good':pace>=need*0.5?'warn':'bad',ic:g.ic,sc:g.id==='g_dic'?['semana','mes']:['mes'],ti:`${g.name}: necesitas ${short(need)}/mes y vas a ${short(pace)}/mes`,
      tx:pace>=need?'Vas al ritmo para llegar a tiempo.':(pace>0?`A este ritmo la cumples en ${yrs>=1?nf1.format(yrs)+' años':Math.ceil(yrs*12)+' meses'}, no para el ${fDate(g.date)} ${pd(g.date).getFullYear()}.`:'Todavía no le entra plata. Revisa su porcentaje en Metas.')+(g.id==='g_nexo'&&pace<need?' Con tu sueldo actual no se llega solo ahorrando: necesitas ingresos de la agencia y la app web.':'')});}
  const fxAccs=S.accounts.filter(a=>a.cur!=='COP'&&accBal(a.id)>0.01);
  for(const a of fxAccs){const {bal,basis}=fxBasis(a); const now=toCOP(bal,a.cur); const ch=basis>0?now/basis-1:0;
    out.push({lv:ch<-0.03?'warn':'info',ic:'💱',sc:['mes'],ti:`${a.name}: ${money(bal,a.cur)} = ${cop(now)} hoy`,
      tx:`Te costaron ${cop(basis)} (${ch>=0?'+':''}${nf1.format(ch*100)} %). Tus metas son en pesos: guardar el ahorro en ${a.cur==='USD'?'dólares':'euros'} es apostarle a que esa moneda suba. Úsala para suscripciones y compras en el exterior.`});}
  if(!S.accounts.some(a=>/\bnu\b/i.test(a.name))&&goals().some(g=>(eb[g.id]||0)>0))
    out.push({lv:'info',ic:'🏦',sc:['mes'],ti:'Tu ahorro en Nequi casi no rinde',tx:'Nequi paga cerca de 0,1 % al año. Una Cajita de Nu pagaba hasta 11,25 % EA en 2026 (confírmalo en la app). Si la abres, agrégala en Más → Cuentas y ponla como cuenta de tus metas.'});
  const ord={bad:0,warn:1,good:2,info:3}, rk=x=>x.key?0.5:ord[x.lv]; return out.sort((a,b)=>rk(a)-rk(b));
}

function favorites(){
  const from=Date.now()-60*DAY, m={};
  for(const t of S.tx){if(t.type!=='gasto'||t.t<from||t.subId)continue;const k=[t.cat,Math.round(t.cop),t.acc,t.env].join('|');m[k]=(m[k]||0)+1;}
  const perCat={};let f=Object.entries(m).filter(x=>x[1]>=2).sort((a,b)=>b[1]-a[1]).filter(x=>{const c=x[0].split('|')[0];perCat[c]=(perCat[c]||0)+1;return perCat[c]<=2;}).slice(0,4).map(x=>{const [cat,c,acc,env]=x[0].split('|');return {cat,cop:+c,acc,env};});
  const defs=[{cat:'escolar',cop:5000,acc:'efectivo',env:'gastos'},{cat:'escolar',cop:10000,acc:'efectivo',env:'gastos'},{cat:'super',cop:60000,acc:'nequi',env:'gastos'},{cat:'internet',cop:50000,acc:'nequi',env:'gastos'}];
  for(const d of defs){if(f.length>=4)break; if(!f.some(x=>x.cat===d.cat&&x.cop===d.cop)&&accById(d.acc))f.push(d);}
  return f.filter(x=>accById(x.acc));
}

function spark(cur){
  const pts=S.set.rateHist.filter(p=>p[cur]>0&&p.ts>=Date.now()-7*DAY);
  if(pts.length<2)return `<div class="muted">${cur==='USD'?'Dólar':'Euro'}: aún no hay suficientes datos. Se guarda un precio cada 3 horas.</div>`;
  const W=340,H=70,L=4,T=8; const vs=pts.map(p=>p[cur]); const mn=Math.min(...vs),mx=Math.max(...vs),rg=(mx-mn)||1;
  const x=i=>L+i/(pts.length-1)*(W-2*L), y=v=>T+(1-(v-mn)/rg)*(H-2*T);
  const avg=vs.reduce((a,b)=>a+b,0)/vs.length, ch=vs[vs.length-1]/avg-1;
  return `<div><div class="row" style="justify-content:space-between;font-size:13px"><b>${cur==='USD'?'Dólar':'Euro'} · 7 días</b><span class="num ${Math.abs(ch)>=0.015?'':'muted'}">${ch>=0?'+':''}${nf1.format(ch*100)} % vs promedio</span></div>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Precio del ${cur==='USD'?'dólar':'euro'} en 7 días"><line x1="${L}" x2="${W-L}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--ink-3)" stroke-dasharray="4 4"/>
  <path d="${pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(p[cur]).toFixed(1)).join('')}" fill="none" stroke="${cur==='USD'?'var(--s-in)':'#6250d6'}" stroke-width="2"/>
  <circle cx="${x(pts.length-1)}" cy="${y(vs[vs.length-1])}" r="4" fill="${cur==='USD'?'var(--s-in)':'#6250d6'}"/></svg>
  <div class="row muted num" style="justify-content:space-between;font-size:11px"><span>mín ${cop(mn)}</span><span>promedio ${cop(avg)}</span><span>máx ${cop(mx)}</span></div></div>`;
}

/* ---------- gráficas ---------- */
function periodBuckets(){
  const t=today(), P=V.period, B=[];
  if(P==='semana'){for(let i=6;i>=0;i--){const d=addD(t,-i);B.push({a:d.getTime(),b:d.getTime()+DAY,l:DIA[d.getDay()]+' '+d.getDate()});}}
  else if(P==='mes'){const y=t.getFullYear(),m=t.getMonth(),last=new Date(y,m+1,0).getDate();for(let s=1;s<=last;s+=7){const a=new Date(y,m,s),b=new Date(y,m,Math.min(last,s+6)+1);B.push({a:a.getTime(),b:b.getTime(),l:s+'–'+Math.min(last,s+6)});}}
  else {for(let i=5;i>=0;i--){const a=new Date(t.getFullYear(),t.getMonth()-i,1),b=new Date(t.getFullYear(),t.getMonth()-i+1,1);B.push({a:a.getTime(),b:b.getTime(),l:MES[a.getMonth()]});}}
  for(const k of B){k.in=0;k.out=0;for(const x of S.tx){if(x.t<k.a||x.t>=k.b)continue;if(x.type==='ingreso')k.in+=x.cop;if(x.type==='gasto')k.out+=x.cop;}}
  return B;
}
function statsCard(){const B=periodBuckets(); const a=B[0].a,b=B[B.length-1].b;
  const inn=B.reduce((s,x)=>s+x.in,0), out=B.reduce((s,x)=>s+x.out,0);
  let sv=0; for(const x of S.tx){if(x.type==='ingreso'&&x.t>=a&&x.t<b)for(const k in x.alloc){if(envById(k)?.kind==='meta')sv+=x.alloc[k];}}
  return `<section class="card"><div class="stats num"><div class="stat"><b>${cop(inn)}</b><span>ingresos</span></div><div class="stat"><b>${cop(out)}</b><span>gastos</span></div><div class="stat"><b>${cop(sv)}</b><span>al ahorro</span></div><div class="stat"><b>${inn?pct(sv/inn):'—'}</b><span>de lo que entró</span></div></div></section>`;}
function catBars(){const B=periodBuckets(); const a=B[0].a,b=B[B.length-1].b, m={};
  for(const x of S.tx){if(x.type==='gasto'&&x.t>=a&&x.t<b)m[x.cat]=(m[x.cat]||0)+x.cop;}
  const e=Object.entries(m).sort((x,y)=>y[1]-x[1]); const max=e[0]?e[0][1]:1, tot=e.reduce((s,x)=>s+x[1],0);
  return e.map(([k,v])=>`<div class="catbar"><span>${CAT(k).ic} ${esc(CAT(k).name.replace('­',''))}</span><span class="num muted">${cop(v)} · ${pct(v/tot)}</span><div class="bar"><i style="width:${(v/max*100).toFixed(1)}%"></i></div></div>`).join('')||'<div class="empty">Sin gastos en este periodo.</div>';}
function niceMax(v){if(v<=0)return 10000;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;}
function bindCharts(){
  const B=periodBuckets(); const W=340,H=190,L=46,Rr=6,T=10,Bm=26; const iw=W-L-Rr, ih=H-T-Bm;
  const max=niceMax(Math.max(...B.map(b=>Math.max(b.in,b.out))));
  const y=v=>T+ih-(v/max)*ih; const bw=iw/B.length; const barW=Math.min(18,(bw-10)/2);
  const top=(x,y0,w,h)=>{if(h<=0)return '';const r=Math.min(4,w/2,h);return `M${x},${y0+h}V${y0+r}Q${x},${y0} ${x+r},${y0}H${x+w-r}Q${x+w},${y0} ${x+w},${y0+r}V${y0+h}Z`;};
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y gastos por periodo">`;
  for(let i=0;i<=4;i++){const v=max*i/4;s+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--ink-3)">${short(v).replace('$','')}</text>`;}
  B.forEach((b,i)=>{const cx=L+bw*i+bw/2;
    s+=`<path d="${top(cx-barW-1,y(b.in),barW,T+ih-y(b.in))}" fill="var(--s-in)"/><path d="${top(cx+1,y(b.out),barW,T+ih-y(b.out))}" fill="var(--s-out)"/>`;
    s+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${b.l}</text>`;
    s+=`<rect class="hit" data-i="${i}" x="${L+bw*i}" y="${T}" width="${bw}" height="${ih+Bm}" fill="transparent"/>`;});
  s+='</svg>'; const el=$('#ch-bars'); el.innerHTML=s;
  const show=i=>{const b=B[i];$('#ch-bars-d').innerHTML=`<b>${b.l}</b> · Ingresos ${cop(b.in)} · Gastos ${cop(b.out)} · Neto ${cop(b.in-b.out)}`;};
  el.querySelectorAll('.hit').forEach(r=>{r.addEventListener('click',()=>show(+r.dataset.i));r.addEventListener('mouseenter',()=>show(+r.dataset.i));});
  // línea de ahorro
  const a=B[0].a, end=Math.min(B[B.length-1].b,today().getTime()+DAY); const pts=[];
  const step=V.period==='6m'?3*DAY:DAY;
  for(let t=a;t<=end;t+=step){const s2=savingsAt(t+DAY-1);pts.push({t,...s2});}
  if(pts.length<2){$('#ch-line').innerHTML='<div class="empty">Aún no hay datos.</div>';return;}
  const mx=niceMax(Math.max(...pts.map(p=>Math.max(p.should,p.real)),1)), mn=Math.min(0,...pts.map(p=>p.real));
  const yy=v=>T+ih-((v-mn)/(mx-mn))*ih, xx=i=>L+i/(pts.length-1)*iw;
  let l=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ahorro real comparado con lo que deberías llevar">`;
  for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4;l+=`<line x1="${L}" x2="${W-Rr}" y1="${yy(v)}" y2="${yy(v)}" stroke="var(--line)"/><text x="${L-6}" y="${yy(v)+4}" text-anchor="end" font-size="10" fill="var(--ink-3)">${short(v).replace('$','')}</text>`;}
  const path=k=>pts.map((p,i)=>(i?'L':'M')+xx(i).toFixed(1)+','+yy(p[k]).toFixed(1)).join('');
  l+=`<path d="${path('real')}L${xx(pts.length-1)},${yy(Math.max(0,mn))}L${L},${yy(Math.max(0,mn))}Z" fill="var(--s-save)" opacity=".12"/>`;
  l+=`<path d="${path('should')}" fill="none" stroke="var(--ink-3)" stroke-width="2" stroke-dasharray="5 4"/><path d="${path('real')}" fill="none" stroke="var(--s-save)" stroke-width="2.2" stroke-linejoin="round"/>`;
  const lp=pts[pts.length-1]; l+=`<circle cx="${xx(pts.length-1)}" cy="${yy(lp.real)}" r="4.5" fill="var(--s-save)" stroke="var(--surface)" stroke-width="2"/>`;
  [0,Math.floor((pts.length-1)/2),pts.length-1].forEach(i=>{l+=`<text x="${xx(i)}" y="${H-8}" text-anchor="${i===0?'start':i===pts.length-1?'end':'middle'}" font-size="10" fill="var(--ink-3)">${fDate(pts[i].t)}</text>`;});
  l+=`<line id="xh" x1="0" x2="0" y1="${T}" y2="${T+ih}" stroke="var(--ink-3)" stroke-width="1" opacity="0"/><rect id="lhit" x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  const le=$('#ch-line'); le.innerHTML=l;
  const svg=le.querySelector('svg'), hit=le.querySelector('#lhit'), xh=le.querySelector('#xh');
  const mv=ev=>{const r=svg.getBoundingClientRect();const px=(ev.clientX-r.left)/r.width*W;const i=Math.max(0,Math.min(pts.length-1,Math.round((px-L)/iw*(pts.length-1))));
    xh.setAttribute('x1',xx(i));xh.setAttribute('x2',xx(i));xh.setAttribute('opacity','.6');
    const p=pts[i];$('#ch-line-d').innerHTML=`<b>${fDate(p.t)}</b> · Real ${cop(p.real)} · Deberías ${cop(p.should)}${p.real<p.should-1000?' · <span style="color:var(--bad)">faltan '+cop(p.should-p.real)+'</span>':''}`;};
  hit.addEventListener('pointermove',mv);hit.addEventListener('click',mv);
  $('#ch-line-d').innerHTML=`<b>Hoy</b> · Real ${cop(lp.real)} · Deberías ${cop(lp.should)}`;
}

function qTime(){const d=new Date();if(Q.day){d.setDate(d.getDate()-Q.day);d.setHours(12,0,0,0);}return d.getTime();}
function saveQ(){
  const A=qAmt(); if(!(A>0))return; const acc=accById(Q.acc); let tx;
  const rateIn=$('#q_rate'); if(rateIn){const v=parseFloat(rateIn.value.replace(',','.'));if(v>0)Q.rate=v;}
  if(Q.mode==='gasto'){const c=Math.round(toCOP(A,Q.cur)); const amount=Q.cur===acc.cur?A:r2(fromCOP(c,acc.cur));
    const env=Q.cat==='meta'?Q.goal:CAT(Q.cat).env;
    tx={id:uid(),type:'gasto',t:qTime(),acc:acc.id,amount:acc.cur==='COP'?Math.round(amount):amount,cop:c,cat:Q.cat,env};}
  else if(Q.mode==='ingreso'){const c=Math.round(toCOP(A,Q.cur)); const amount=Q.cur===acc.cur?A:r2(fromCOP(c,acc.cur));
    if(Q.incomeId){const inc=S.incomes.find(i=>i.id===Q.incomeId); const p=pendingDues(inc); const due=p.length?p[0]:nextDue(inc,addD(today(),-1));
      tx={id:uid(),type:'ingreso',t:qTime(),acc:acc.id,amount,cop:c,cat:'sueldo',incomeId:inc.id,due:ymd(due),kind:'fijo',alloc:allocate(c,'fijo',nextDue(inc,due))};}
    else tx={id:uid(),type:'ingreso',t:qTime(),acc:acc.id,amount,cop:c,cat:Q.cat,kind:'extra',alloc:allocate(c,'extra',addD(today(),30))};}
  else if(Q.envMode){tx={id:uid(),type:'apartado',t:Date.now(),envFrom:Q.envFrom,envTo:Q.envTo,cop:Math.round(A),amount:Math.round(A)};}
  else {const a2=accById(Q.acc2); let amount2=A;
    if(a2.cur!==acc.cur){amount2=acc.cur==='COP'?A/Q.rate:A*Q.rate;}
    const c=acc.cur==='COP'?A:a2.cur==='COP'?amount2:toCOP(A,acc.cur);
    tx={id:uid(),type:'mover',t:Date.now(),acc:acc.id,acc2:a2.id,amount:A,amount2:a2.cur==='COP'?Math.round(amount2):r2(amount2),cop:Math.round(c)};}
  S.tx.push(tx); if(Q.mode!=='mover')S.set.lastAcc=acc.id; save(); closeSheet(); render();
  toast(Q?'':msgFor(tx),tx.id);
}

    onDelete:id?()=>{S.incomes=S.incomes.filter(x=>x.id!==id);}:null});}
function formGoal(id){const g=envById(id)||{name:'',ic:'🎯',target:'',date:ymd(addD(today(),365)),share:10,accounts:[S.accounts[1]?.id||S.accounts[0].id],items:null};
  openForm({title:id?'Editar meta':'Nueva meta',fields:[{k:'name',label:'Nombre',type:'text',value:g.name,ph:'Ej. Viaje fin de año'},{k:'ic',label:'Ícono',type:'chips',value:g.ic,options:['🎯','🎄','🖥️','📷','🎮','📱','✈️','🛡️','🎓'].map(e=>({v:e,l:e}))},{k:'target',label:g.items&&g.items.length?'Meta (se calcula con la lista de cosas)':'¿Cuánto necesitas? (pesos)',type:'number',value:g.items&&g.items.length?goalTarget(g):g.target},{k:'date',label:'¿Para cuándo?',type:'date',value:g.date},{k:'accounts',label:'¿En qué cuenta la guardas?',type:'multi',value:g.accounts||[],options:accOpts()}],
    onSave:v=>{if(!v.name)return 'Ponle un nombre.'; const o={name:v.name,ic:v.ic,date:v.date||g.date,accounts:v.accounts.length?v.accounts:[S.accounts[0].id]}; if(!(g.items&&g.items.length))o.target=v.target||0;
      if(id)Object.assign(g,o); else S.envs.push({id:'g_'+uid(),kind:'meta',share:10,items:[],...o,target:v.target||0});},
    onDelete:id?()=>{const eb=envBals(); if(Math.abs(eb[id]||0)>0)return `Tiene ${cop(eb[id])}. Pásalos a otra meta con Mover → Entre apartados y luego bórrala.`; S.envs=S.envs.filter(e=>e.id!==id);}:null});}
function formItem(gid){const g=envById(gid);
  openForm({title:'Agregar a '+g.name,fields:[{k:'name',label:'¿Qué vas a comprar?',type:'text',value:'',ph:'Ej. Trípode'},{k:'price',label:'Precio aproximado (pesos)',type:'number',value:''}],
    onSave:v=>{if(!v.name||!(v.price>0))return 'Falta el nombre o el precio.'; g.items=g.items||[]; if(!g.items.length&&g.target)g.items.push({id:uid(),name:'Meta anterior',price:g.target}); g.items.push({id:uid(),name:v.name,price:v.price});}});}
function formAdjust(id){const a=accById(id);
  openForm({title:'Saldo real de '+a.name,fields:[{k:'bal',label:`¿Cuánto tienes de verdad? (${a.cur})`,type:'number',value:accBal(id),note:'Si no cuadra, se crea un ajuste en "Para gastar" por la diferencia. Así la app vuelve a quedar igual a tu cuenta.'}],
    onSave:v=>{if(!isFinite(v.bal))return 'Escribe un número.'; const d=r2(v.bal-accBal(id)); if(Math.abs(d)<0.005)return; S.tx.push({id:uid(),type:'ajuste',t:Date.now(),acc:id,amount:d,cop:Math.round(toCOP(d,a.cur)),env:'gastos',note:'Ajuste de saldo'});}});}
function formSetup(){
  const fields=S.accounts.map(a=>({k:'b_'+a.id,label:`¿Cuánto tienes hoy en ${a.name}? (${a.cur})`,type:'number',value:''}));
  fields.push({k:'saved',label:'De todo eso, ¿cuánto ya es ahorro? (pesos, va a Diciembre)',type:'number',value:''});
  fields.push({k:'owed',label:'¿Te deben alguna quincena ahora mismo?',type:'chips',value:'0',options:[{v:'0',l:'No'},{v:'1',l:'Sí, una'},{v:'2',l:'Sí, dos'}]});
  openForm({title:'Empezar con mis datos',fields,onSave:v=>{
    const keep={set:S.set,accounts:S.accounts,envs:S.envs,cards:S.cards,incomes:S.incomes};
    S={...baseState(),...keep,subs:[],tx:[],demo:false}; S.set.rateHist=S.set.rateHist||[];
    const t=Date.now();
    for(const a of S.accounts){const n=v['b_'+a.id]; if(n>0)S.tx.push({id:uid(),type:'ajuste',t,acc:a.id,amount:a.cur==='COP'?Math.round(n):r2(n),cop:Math.round(toCOP(n,a.cur)),env:a.cur==='COP'?'gastos':'fijos',note:'Saldo inicial'});}
    if(v.saved>0){const dic=goals()[0]; if(dic)S.tx.push({id:uid(),type:'apartado',t:t+1,envFrom:'gastos',envTo:dic.id,cop:Math.round(v.saved),amount:Math.round(v.saved)});}
    const owed=+v.owed; for(const inc of S.incomes){ const back=dueDates(inc,addD(today(),-70),today()); inc.start=owed>0&&back.length>=owed?ymd(back[back.length-owed]):ymd(addD(today(),1)); }
    V.tab='inicio';V.sub=null;}});
}

/* ---------- tasas, alertas y actualizaciones ---------- */
async function fetchRates(manual){
  const d=await fetchRateData();
  if(!d){ if(manual)toast('No pude conectarme. Escribe la tasa a mano.'); return; }
  const ts=Date.now(); S.set.rates={USD:d.USD,EUR:d.EUR,at:fTime(ts),src:d.src,ts};
  addHistPoint(S.set.rateHist,{ts,USD:d.USD,EUR:d.EUR}); save(); render(); notifyFx();
  if(manual)toast('Tasas actualizadas.');
}
async function notifyFx(){
  if(!S.set.notif||typeof Notification==='undefined'||Notification.permission!=='granted')return;
  const sig=fxSignals(S.set.rateHist,fxSummary()).filter(x=>!S.set.fxSeen[x.key]); if(!sig.length)return;
  try{const reg=await navigator.serviceWorker?.ready; for(const x of sig){ if(reg)await reg.showNotification(x.ti,{body:x.tx,icon:'icons/icon-192.png',badge:'icons/icon-192.png',tag:x.key}); S.set.fxSeen[x.key]=Date.now(); } save();}catch(e){}
}
async function enableNotif(){
  try{const p=await Notification.requestPermission(); if(p!=='granted'){render();return;}
    S.set.notif=true; S.set.bg=false;
    const reg=await navigator.serviceWorker?.ready;
    if(reg&&'periodicSync' in reg){try{const st=await navigator.permissions.query({name:'periodic-background-sync'}); if(st.state==='granted'){await reg.periodicSync.register('tasas',{minInterval:RATE_MS}); S.set.bg=true;}}catch(e){}}
    save(); render(); toast('Avisos activados.'); notifyFx();
  }catch(e){toast('Este navegador no deja activar avisos.');}
}
let swReg=null, remoteVer=null, reloading=false;
const updateReady=()=>!!(swReg&&swReg.waiting&&navigator.serviceWorker.controller);
async function checkUpdate(manual){
  try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'}); if(r.ok)remoteVer=await r.json();}catch(e){}
  try{if(swReg)await swReg.update();}catch(e){}
  S.set.lastCheck=Date.now(); save(); render();
  if(manual)toast(updateReady()?'Hay una versión nueva lista para instalar.':remoteVer&&remoteVer.version!==APP_VERSION?'Descargando la versión nueva. En un momento te sale el botón.':'Ya tienes la última versión.');
}
function applyUpdate(){ if(swReg&&swReg.waiting)swReg.waiting.postMessage('skipWaiting'); else location.reload(); }
function tick(){ if(Date.now()-(S.set.rates.ts||0)>=RATE_MS)fetchRates(false); if(Date.now()-(S.set.lastCheck||0)>=RATE_MS)checkUpdate(false); }

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b)return; const a=b.dataset.a, d=b.dataset;
  switch(a){
    case 'tab': V.tab=d.tab; if(V.sub){V.sub=null;} render(); window.scrollTo(0,0); break;
    case 'go': V.sub=d.sub; V.confirm=null; openLayer(); render(); window.scrollTo(0,0); break;
    case 'back': if(pushed)history.back(); else {V.sub=null;render();} break;
    case 'add': openAdd(d.mode||'gasto'); break;
    case 'close': closeSheet(); break;
    case 'period': V.period=d.p; render(); break;
    case 'adv': V.adv=d.p; render(); break;
    case 'fav': {const f=favorites()[+d.i]; if(!f)break; const acc=accById(f.acc); const tx={id:uid(),type:'gasto',t:Date.now(),acc:acc.id,amount:acc.cur==='COP'?f.cop:r2(fromCOP(f.cop,acc.cur)),cop:f.cop,cat:f.cat,env:f.env}; S.tx.push(tx); save(); render(); toast(msgFor(tx),tx.id); break;}
    case 'payinc': {const inc=S.incomes.find(i=>i.id===d.id); const p=pendingDues(inc); const due=p.length?p[0]:nextDue(inc,addD(today(),-1)); const tx=payIncomeAt(inc,ymd(due),Date.now()); save(); render(); const dep=Object.entries(tx.alloc).filter(([k])=>{const e=envById(k);return e&&e.kind==='meta'&&!(e.accounts||[]).includes(tx.acc);}).reduce((a,x)=>a+x[1],0);
      toast(`${inc.name} (quincena ${fDate(due)}) guardado.${dep?' Consigna '+cop(dep)+' en Nequi para tus metas.':''}`,tx.id); break;}
    case 'paysub': {const s=S.subs.find(x=>x.id===d.id); const tx=paySubAt(s,d.due,Date.now()); save(); render(); toast(`Cobro de ${s.name} guardado.`,tx.id); break;}
    case 'undo': S.tx=S.tx.filter(t=>t.id!==d.id); save(); render(); $('#toast').hidden=true; break;
    case 'txopen': V.openTx=V.openTx===d.id?null:d.id; V.confirm=null; render(); break;
    case 'txdel': if(V.confirm===d.id){S.tx=S.tx.filter(t=>t.id!==d.id);V.confirm=null;V.openTx=null;save();toast('Movimiento eliminado.');} else V.confirm=d.id; render(); break;
    case 'goalopen': V.goalOpen=V.goalOpen===d.id?null:d.id; render(); break;
    case 'share': {const g=envById(d.id); g.share=Math.max(0,Math.min(100,(+g.share||0)+(+d.d))); save(); render(); break;}
    case 'pct': S.set[d.k]=Math.max(0,Math.min(90,S.set[d.k]+(+d.d))); save(); render(); break;
    case 'envacc': {const e2=envById(d.env); const s=new Set(e2.accounts||[]); s.has(d.acc)?s.delete(d.acc):s.add(d.acc); if(!s.size)break; e2.accounts=[...s]; save(); render(); break;}
    case 'editacc': formAccount(d.id); break;
    case 'adjust': formAdjust(d.id); break;
    case 'editcard': formCard(d.id); break;
    case 'editsub': formSub(d.id,d.card); break;
    case 'editinc': formIncome(d.id); break;
    case 'editgoal': formGoal(d.id); break;
    case 'additem': formItem(d.id); break;
    case 'setup': formSetup(); break;
    case 'fchip': {readForm(); const f=F.fields.find(x=>x.k===d.k); if(f.type==='multi'){const s=new Set(F.vals[d.k]||[]); s.has(d.v)?s.delete(d.v):s.add(d.v); F.vals[d.k]=[...s];} else F.vals[d.k]=d.v; renderForm(); break;}
    case 'fsave': {const err=F.onSave(readForm()); if(err){$('#f_err').textContent=err;break;} save(); closeSheet(); render(); toast('Guardado.'); break;}
    case 'fdel': {if(!F.confirmDel){F.confirmDel=true;readForm();renderForm();break;} const err=F.onDelete(); if(err){$('#f_err').textContent=err;break;} save(); closeSheet(); render(); toast('Eliminado.'); break;}
    case 'fetchrates': fetchRates(true); break;
    case 'saverates': {const u=parseFloat($('#f_usd').value.replace(',','.')), eu=parseFloat($('#f_eur').value.replace(',','.')); if(u>0&&eu>0){S.set.rates={USD:u,EUR:eu,at:fTime(Date.now()),src:'Escrita a mano',ts:Date.now()};save();render();toast('Tasas guardadas.');} break;}
    case 'notifon': enableNotif(); break;
    case 'notifoff': S.set.notif=false; save(); render(); break;
    case 'applyupd': applyUpdate(); break;
    case 'chkupd': checkUpdate(true); break;
    case 'ideaadd': {const el=$('#f_idea'); const v=(el.value||'').trim(); if(!v)break; S.ideas.push({id:uid(),t:Date.now(),txt:v}); save(); render(); toast('Idea guardada.'); break;}
    case 'ideadel': S.ideas=S.ideas.filter(i=>i.id!==d.id); save(); render(); break;
    case 'ideacopy': {const txt=`Ideas para NEXO Finanzas (tengo la versión ${APP_VERSION}):\n`+S.ideas.map((i,k)=>`${k+1}. ${i.txt}`).join('\n'); navigator.clipboard?.writeText(txt).then(()=>toast('Copiadas. Pégalas en el chat con Claude.')).catch(()=>toast('Tu navegador no dejó copiar. Selecciona el texto a mano.')); break;}
    case 'export': {try{const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='nexo-finanzas-'+ymd(new Date())+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Copia descargada.');}catch(err){toast('No se pudo descargar. Usa "Copiar como texto".');} break;}
    case 'copyjson': {const txt=JSON.stringify(S); navigator.clipboard?.writeText(txt).then(()=>toast('Copia copiada. Pégala en una nota o en Drive.')).catch(()=>toast('Tu navegador no dejó copiar.')); break;}
    case 'import': $('#importFile').click(); break;
    case 'wipe': if(V.confirm==='wipe'){S=baseState();V.confirm=null;save();V.sub=null;render();toast('Todo borrado.');} else {V.confirm='wipe';render();} break;
    case 'demo': S=demoState(); save(); V.sub=null; V.tab='inicio'; render(); break;
    /* hoja rápida */
    case 'qmode': {const m=d.m; openAdd(m); break;}
    case 'qinc': {const i=S.incomes.find(x=>x.id===d.id); if(Q.incomeId===i.id){Q.incomeId=null;Q.str='';}else{Q.incomeId=i.id;Q.str=String(i.amount);Q.cur='COP';Q.acc=i.acc;Q.cat=null;} renderAdd(); break;}
    case 'qenvmode': Q.envMode=d.v==='1'; Q.cur='COP'; renderAdd(); break;
    case 'qadd': {Q.str=String(r2(qAmt()+(+d.v))).replace('.',','); renderAdd(); break;}
    case 'qclear': Q.str=''; renderAdd(); break;
    case 'qkeys': Q.keypad=!Q.keypad; renderAdd(); break;
    case 'qkey': {const k=d.k; if(k==='⌫')Q.str=Q.str.slice(0,-1); else if(k===','){if(!Q.str.includes(','))Q.str=(Q.str||'0')+',';} else if(Q.str.length<12){Q.str=(Q.str==='0'?'':Q.str)+k;} renderAdd(); break;}
    case 'qcur': Q.cur=d.c; Q.str=''; renderAdd(); break;
    case 'qcat': Q.cat=Q.cat===d.id?null:d.id; renderAdd(); break;
    case 'qgoal': Q.goal=d.id; renderAdd(); break;
    case 'qacc': Q.acc=d.id; if(Q.acc2===d.id)Q.acc2=S.accounts.find(x=>x.id!==d.id)?.id; Q.rate=null; if(Q.mode!=='mover'&&accById(d.id).cur!==Q.cur&&Q.cur!=='COP')Q.cur='COP'; renderAdd(); break;
    case 'qacc2': Q.acc2=d.id; Q.rate=null; renderAdd(); break;
    case 'qenvf': Q.envFrom=d.id; if(Q.envTo===d.id)Q.envTo=null; renderAdd(); break;
    case 'qenvt': Q.envTo=d.id; renderAdd(); break;
    case 'qday': Q.day=+d.v; renderAdd(); break;
    case 'qsave': saveQ(); break;
  }
});
document.addEventListener('input',e=>{ if(e.target.id==='q_rate'&&Q){const v=parseFloat(e.target.value.replace(',','.')); if(v>0){Q.rate=v;}} });
$('#importFile').addEventListener('change',e=>{const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{try{const o=JSON.parse(r.result); if(o.v!==1||!Array.isArray(o.tx))throw 0; S=o; save(); V.sub=null; render(); toast('Copia restaurada.');}catch(err){toast('Ese archivo no es una copia de NEXO Finanzas.');}}; r.readAsText(f); e.target.value='';});

/* ---------- inicio ---------- */
S=load()||demoState(); save();
render();
const ps=new URLSearchParams(location.search).get('add'); if(ps&&['gasto','ingreso','mover'].includes(ps)) openAdd(ps);
tick(); syncFromSW(); pushSummaryToSW();
setInterval(tick,10*60e3);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){syncFromSW();tick();}});
if('serviceWorker' in navigator&&window.isSecureContext&&location.protocol!=='file:'){
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{swReg=reg;
    reg.addEventListener('updatefound',()=>{const w=reg.installing; w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller){render();toast('Hay una versión nueva. Toca "Actualizar" arriba.');}});});
    render();}).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!reloading){reloading=true;location.reload();}});
}
})();
</script>
