<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F0D0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Oro $">

<title>Oro y Préstamos</title>
<style>
:root{
  --bg:#0F0D0A;--card:#1B1813;--card2:#26221B;--line:#352F25;--ink:#F5EFE2;--sub:#B3AA96;--gold2:#F1D58E;
  --hero1:#3A2E15;--hero2:#1B1813;--herob:#4A3B1C;--tabbg:rgba(20,18,14,.97);--dim:rgba(0,0,0,.6);
  --okt:#5FD08E;--badt:#FF8A80;--hoyt:#FFA463;
  --compra:#E0A526;--venta:#22A55B;--presta:#3B7BF6;--cobra:#14B8A6;--enviar:#8B5CF6;--recor:#EC4899;--mal:#EF4444;--hoy:#F97316;--ver:#3A342B;--vert:#F5EFE2;
  --fs:16px;
}
.light{--bg:#F6F3EC;--card:#FFFFFF;--card2:#F1ECE1;--line:#E4DDCF;--ink:#1C1912;--sub:#6B6456;--gold2:#8A6410;
  --hero1:#FBEFD0;--hero2:#FFFFFF;--herob:#EBD9A8;--tabbg:rgba(255,255,255,.97);--dim:rgba(0,0,0,.4);
  --okt:#167A3F;--badt:#C62828;--hoyt:#C2410C;--ver:#E4DDCF;--vert:#1C1912}
@media (prefers-color-scheme:light){.auto{--bg:#F6F3EC;--card:#FFFFFF;--card2:#F1ECE1;--line:#E4DDCF;--ink:#1C1912;--sub:#6B6456;--gold2:#8A6410;
  --hero1:#FBEFD0;--hero2:#FFFFFF;--herob:#EBD9A8;--tabbg:rgba(255,255,255,.97);--dim:rgba(0,0,0,.4);
  --okt:#167A3F;--badt:#C62828;--hoyt:#C2410C;--ver:#E4DDCF;--vert:#1C1912}}
.grande{--fs:18.5px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink)}
body{font:var(--fs)/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;font-size:max(16px,1em);color:var(--ink)}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 100px);min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px;gap:8px;min-height:44px}
.top h1{font-size:1.45em;letter-spacing:-.02em}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--card2);display:grid;place-items:center;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:10px}
.hero{background:linear-gradient(140deg,var(--hero1),var(--hero2) 70%);border-color:var(--herob)}
.lbl{font-size:.68em;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.big{font-size:1.75em;font-weight:750;letter-spacing:-.02em;color:var(--gold2)}
.mid{font-size:1.08em;font-weight:650}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sub{color:var(--sub);font-size:.8em}
.ok{color:var(--okt)}.bad{color:var(--badt)}.hoyc{color:var(--hoyt)}
.chip{font-size:.68em;padding:3px 9px;border-radius:99px;white-space:nowrap;font-weight:650}
.c-ok{background:rgba(34,165,91,.18);color:var(--okt)}.c-mal{background:rgba(239,68,68,.18);color:var(--badt)}
.c-hoy{background:rgba(249,115,22,.18);color:var(--hoyt)}.c-gold{background:rgba(224,165,38,.2);color:var(--gold2)}.c-gris{background:var(--card2);color:var(--sub)}
.k2{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.k2>div{background:rgba(0,0,0,.18);border-radius:12px;padding:8px 9px}
.light .k2>div{background:rgba(0,0,0,.04)}
.k2 .v{font-size:.92em;font-weight:650;margin-top:1px}
.sec{font-size:.85em;font-weight:700;margin:14px 2px 7px;display:flex;justify-content:space-between;align-items:center}
.pp{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.pp:first-child{border-top:0}
.ini{width:36px;height:36px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:.78em;font-weight:700;flex:none}
.pp .t{flex:1;min-width:0}.pp .t b{display:block;font-size:.92em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;flex:none}
.act{display:flex;align-items:center;justify-content:center;gap:7px;border-radius:14px;font-weight:700;padding:11px 10px;color:#fff;min-height:44px}
.a-compra{background:var(--compra);color:#231600}.a-venta{background:var(--venta)}.a-presta{background:var(--presta)}
.a-cobra{background:var(--cobra);color:#042420}.a-enviar{background:var(--enviar)}.a-recor{background:var(--recor)}
.a-mal{background:var(--mal)}.a-ver{background:var(--ver);color:var(--vert)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:2px 0 10px}
.acts .act{flex-direction:column;padding:14px 6px;gap:6px;font-size:.92em}
.acts .act svg.i{width:28px;height:28px}
.mini{font-size:.76em;padding:7px 10px;border-radius:11px;min-height:36px}
.bigbtn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;border-radius:16px;font-weight:750;font-size:1.02em;padding:15px;margin-top:8px;min-height:54px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--tabbg);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-start;padding:8px 6px calc(env(safe-area-inset-bottom) + 6px);z-index:20;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66em;color:var(--sub);width:64px;min-height:44px}
.tabs button.on{color:var(--gold2);font-weight:700}
.tabs .plus{width:56px;height:56px;margin-top:-24px;border-radius:50%;background:var(--ink);color:var(--bg);justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.tabs .plus svg.i{width:28px;height:28px}
.bubble{position:fixed;right:0;bottom:calc(env(safe-area-inset-bottom) + 112px);background:var(--recor);color:#fff;border-radius:14px 0 0 14px;padding:11px 8px 11px 10px;z-index:19;box-shadow:-4px 4px 14px rgba(0,0,0,.35)}
.bubble em{position:absolute;top:-7px;left:-7px;background:#fff;color:#9D174D;font-style:normal;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 4px}
.float{position:fixed;right:10px;left:10px;max-width:420px;margin-left:auto;top:calc(env(safe-area-inset-top) + 70px);max-height:70vh;overflow:auto;background:#2A1322;color:#FCE7F3;border:1px solid #6B2350;border-radius:18px;padding:13px;z-index:41;box-shadow:0 14px 30px rgba(0,0,0,.5)}
.rm{background:rgba(255,255,255,.07);border-radius:11px;padding:9px;margin-top:7px;font-size:.88em;display:flex;gap:10px;align-items:flex-start}
.rm small{display:block;color:#F3A9CF;font-size:.8em;margin-top:2px}
.rm input{width:22px;height:22px;accent-color:var(--recor);flex:none;margin-top:1px}
.dim{position:fixed;inset:0;background:var(--dim);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 18px);z-index:42;border-top:1px solid var(--line);max-width:560px;margin:0 auto;-webkit-overflow-scrolling:touch}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h2{font-size:1.25em;margin:2px 0 12px;display:flex;align-items:center;gap:8px}
.field{display:block;background:var(--card2);border:1.5px solid var(--line);border-radius:13px;padding:7px 11px;margin-bottom:8px}
.field:focus-within{border-color:var(--gold2)}
.field span{display:block;font-size:.7em;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.field input,.field select,.field textarea{width:100%;background:none;border:0;outline:none;font-size:max(16px,1.05em);font-weight:600;padding:3px 0;min-height:32px}
.field textarea{min-height:60px;font-weight:500;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.seg button{flex:1 0 auto;text-align:center;padding:9px 10px;font-size:.84em;border-radius:11px;background:var(--card2);color:var(--sub);min-height:42px;border:1.5px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:700;border-color:var(--ink)}
.step{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:9px}
.step em{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--presta);color:#fff;display:grid;place-items:center;font-size:.75em}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:rgba(34,165,91,.12);border-radius:13px;padding:10px;margin-top:4px}
.adj{display:flex;gap:6px}.adj button{background:var(--card2);border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:700;font-size:.85em;min-height:38px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal span,.cal button{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:.72em;font-weight:650;background:var(--card2);color:var(--sub)}
.cal .h{background:none;aspect-ratio:auto;font-size:.65em}
.cal .p{background:var(--venta);color:#fff}.cal .t{background:var(--hoy);color:#2A1000}.cal .n{background:var(--mal);color:#fff}
.cal .ab{background:linear-gradient(180deg,var(--venta) 55%,#7F1D1D 55%);color:#fff}
.cal .hy{outline:2px solid var(--ink);color:var(--ink)}
.cal .f{background:var(--card2);color:var(--ink);border:1.5px dashed var(--sub)}
.cal .x{opacity:.35}.cal .e{visibility:hidden}
.leg{display:flex;flex-wrap:wrap;gap:6px 11px;font-size:.66em;color:var(--sub);margin-top:9px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.q{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:.88em}
.q:first-child{border-top:0}
.q .bar{width:7px;height:32px;border-radius:3px;flex:none}
.bars{display:flex;align-items:flex-end;gap:6px;height:100px;margin-top:10px}
.bars>div{flex:1;display:flex;gap:2px;align-items:flex-end;height:100%}
.bars i{flex:1;border-radius:4px 4px 0 0;background:var(--venta);min-height:2px}
.bars i+i{background:var(--compra)}
.xl{display:flex;gap:6px;font-size:.62em;color:var(--sub);margin-top:4px}.xl span{flex:1;text-align:center}
.env{border-radius:14px;padding:11px;margin-bottom:8px}
.lg{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.lg .act{width:48px;height:48px;padding:0;flex:none;border-radius:13px}
.lg b{display:block;font-size:.92em}
.empty{text-align:center;padding:22px 12px;color:var(--sub)}
.empty b{display:block;color:var(--ink);font-size:1.05em;margin-bottom:3px}
.list-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 2px;border-top:1px solid var(--line)}
.list-btn:first-child{border-top:0}
.list-btn .t{flex:1}.list-btn .t b{display:block}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:13px;font-size:.88em;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.banner{display:flex;gap:10px;align-items:center;background:rgba(224,165,38,.14);border:1px solid var(--herob);border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:.84em}
/* asistente */
.wz{padding-top:6px}
.wz .prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.wz .prog i{display:block;height:100%;background:var(--compra);border-radius:99px;transition:width .3s}
.wz h2{font-size:1.35em;letter-spacing:-.02em}
.wq{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.wq>b{display:block}
.hint{color:var(--sub);font-size:.8em;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips button{font-size:.92em;border:1.5px solid var(--line);background:var(--card2);border-radius:12px;padding:9px 13px;min-height:44px;text-align:left}
.chips button.on{background:var(--compra);border-color:var(--compra);color:#1E1400;font-weight:700}
.chips button small{font-size:.72em;font-weight:700;opacity:.75;margin-left:4px}
.tin{width:100%;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;min-height:46px;outline:none}
.tin:focus{border-color:var(--gold2)}
.ex{background:rgba(224,165,38,.12);border-radius:12px;padding:9px 11px;font-size:.8em;margin-top:9px}
.wznav{position:fixed;left:0;right:0;bottom:0;background:var(--tabbg);border-top:1px solid var(--line);padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);z-index:20}
.wznav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 2fr;gap:10px}
.wznav button{border-radius:14px;min-height:52px;font-weight:750}
/* bloqueo */
.lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px;text-align:center}
.logo{width:80px;height:80px;border-radius:24px;background:linear-gradient(135deg,#F1D58E,#9C7426);display:grid;place-items:center;color:#2A1C00;font-weight:800;font-size:1.6em;margin-bottom:14px}
.dots{display:flex;gap:14px;margin:26px 0 22px}.dots i{width:14px;height:14px;border-radius:50%;border:1.6px solid var(--gold2)}.dots i.f{background:var(--gold2)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.pad button{height:76px;border-radius:50%;background:var(--card2);font-size:1.6em;font-weight:500}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media print{body *{visibility:hidden}#print,#print *{visibility:visible}#print{position:absolute;left:0;top:0;width:100%;color:#000;background:#fff;padding:20px;font:12pt/1.4 -apple-system,sans-serif}#print table{width:100%;border-collapse:collapse}#print td,#print th{border-bottom:1px solid #ccc;padding:5px;text-align:left}}
#print{display:none}@media print{#print{display:block}}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<div id="print"></div>
<div class="toast" id="toast"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="compra" viewBox="0 0 24 24"><path d="M12 3v11"/><path d="m7 9 5 5 5-5"/><path d="M4 20h16"/></symbol>

<script>
'use strict';
/* =============== utilidades =============== */
const APP_VERSION='1.2.0';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(n,st='')=>`<svg class="i" ${st?`style="${st}"`:''}><use href="#${n}"/></svg>`;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};

/* Festivos de Colombia (Ley Emiliani) */
const holCache={};
function holidays(y){
  if(holCache[y])return holCache[y];
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
  const em=Math.floor((h+l-7*m+114)/31),ed=((h+l-7*m+114)%31)+1;const easter=new Date(y,em-1,ed);
  const set=new Set();const add=d=>set.add(ymd(d));
  const fixed=[[0,1],[4,1],[6,20],[7,7],[11,8],[11,25]];fixed.forEach(([mo,da])=>add(new Date(y,mo,da)));
  const mon=d=>{const x=new Date(d);while(x.getDay()!==1)x.setDate(x.getDate()+1);return x};
  [[0,6],[2,19],[5,29],[7,15],[9,12],[10,1],[10,11]].forEach(([mo,da])=>add(mon(new Date(y,mo,da))));
  const ea=n=>{const x=new Date(easter);x.setDate(x.getDate()+n);return x};
  add(ea(-3));add(ea(-2));add(ea(43));add(ea(64));add(ea(71));
  return holCache[y]=set;
}
const isHoliday=s=>holidays(+s.slice(0,4)).has(s);
const isOff=s=>pd(s).getDay()===0||isHoliday(s);

function oroStats(){
  const c=cfg()||{};let g=c.oro0g||0,cost=(c.oro0g||0)*(c.oro0c||0);
  const mv=[...items('compra'),...items('venta')].sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:a.ts-b.ts);
  const gan={},costoV={};
  for(const m of mv){
    if(m.k==='compra'){g+=m.finos;cost+=m.total}
    else{const avg=g>0?cost/g:0;const cv=avg*m.finos;g-=m.finos;cost-=cv;costoV[m.id]=cv;gan[m.id]=m.total-cv-(m.gastos||0)}
  }
  const conteos=items('conteo').sort((a,b)=>b.ts-a.ts);
  return {g,cost,avg:g>0?cost/g:0,gan,costoV,mv,conteo:conteos[0]||null}
}

/* =============== cálculos: préstamos =============== */
function loanSched(p){
  const n=p.n,base=Math.round(p.total/n);const cuotas=p.fechas.map((f,i)=>({i,f,v:i===n-1?p.total-base*(n-1):base}));
  let acc=0;cuotas.forEach(c=>{acc+=c.v;c.cum=acc});return cuotas;
}
function allocate(p){
  const cuotas=loanSched(p);cuotas.forEach(c=>{c.pays=[];c.got=0});
  if(p.previas){let left=cuotas[Math.min(p.previas,p.n)-1].cum;for(const c of cuotas){if(left<=0.5)break;const m=Math.min(c.v,left);c.pays.push({fecha:'0000-00-00',m,prev:1});c.got+=m;left-=m}}
  const pagos=items('pago').filter(x=>x.prestamo===p.id).sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:a.ts-b.ts);
  for(const x of pagos)if(x.alloc)for(const a of x.alloc){const c=cuotas[a.i];if(c&&a.m>0){c.pays.push({fecha:x.fecha,m:a.m,id:x.id});c.got+=a.m}}
  for(const x of pagos){let left=x.alloc?x.monto-x.alloc.reduce((s,a)=>s+a.m,0):x.monto;
    for(const c of cuotas){if(left<=0.5)break;const rem=c.v-c.got;if(rem<=0.5)continue;const m=Math.min(rem,left);c.pays.push({fecha:x.fecha,m,id:x.id});c.got+=m;left-=m}}
  return {cuotas,pagos};
}
function loanStatus(p,ref){
  ref=ref||today();
  const {cuotas,pagos}=allocate(p);let paid=0;
  cuotas.forEach(c=>{paid+=c.got;const rem=c.v-c.got;c.rem=Math.max(0,rem);
    if(rem<=0.5){let acc=0,pf=null;for(const y of c.pays.slice().sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0)){acc+=y.m;if(acc>=c.v-0.5){pf=y.fecha;break}}c.pf=pf;c.st=pf<=c.f?'p':'t';c.rem=0}
    else if(c.got>0.5){c.st='ab';c.falta=rem}
    else c.st=c.f<ref?'n':c.f===ref?'hoy':'f'});
  const debeHoy=cuotas.filter(c=>c.f<=ref).reduce((s,c)=>s+c.rem,0);
  const atraso=cuotas.filter(c=>c.f<ref).reduce((s,c)=>s+c.rem,0);
  const unpaid=c=>c.st!=='p'&&c.st!=='t';
  const vencidas=cuotas.filter(c=>c.f<=ref&&unpaid(c)).length;
  const lateDays=(()=>{const c=cuotas.find(c=>c.f<ref&&unpaid(c));return c?Math.round((pd(ref)-pd(c.f))/864e5):0})();
  const next=cuotas.find(c=>c.f>ref&&unpaid(c));
  const hoy=cuotas.find(c=>c.f===ref);
  const pagadas=cuotas.filter(c=>!unpaid(c)).length;
  const saldo=Math.max(0,p.total-paid);
  const c=cfg()||{};let mora=0;
  if(c.moraTipo&&c.moraTipo!=='No'&&atraso>0){const v=num(c.moraVal);
    if(c.moraTipo.includes('%'))mora=cuotas.filter(x=>x.f<ref&&unpaid(x)).reduce((s,x)=>s+x.v*v/100,0);
    else mora=v*lateDays}
  return {cuotas,pagos,paid,debeHoy,atraso,vencidas,lateDays,next,hoy,pagadas,saldo,done:saldo<=0.5,mora}
}
/* deja todos los pagos del préstamo amarrados a sus cuotas (para poder corregir una sola) */
function materialize(p){
  const {cuotas,pagos}=allocate(p);
  if(p.previas){cuotas.forEach(c=>{const pv=c.pays.filter(y=>y.prev);if(pv.length){const m=pv.reduce((s,y)=>s+y.m,0);put({id:uid(),k:'pago',prestamo:p.id,fecha:c.f,monto:m,alloc:[{i:c.i,m}],cuaderno:true,pago:p.pago},true)}});p.previas=0;put(p,true)}
  for(const x of pagos){if(x.alloc&&Math.abs(x.alloc.reduce((s,a)=>s+a.m,0)-x.monto)<1)continue;
    const al=[];cuotas.forEach(c=>c.pays.filter(y=>y.id===x.id).forEach(y=>{const e=al.find(a=>a.i===c.i);if(e)e.m+=y.m;else al.push({i:c.i,m:y.m})}));x.alloc=al;put(x,true)}
}
function setCuota(pid,i,mode,fecha,monto,metodo){
  const p=S.items[pid];materialize(p);const c=loanSched(p)[i];
  items('pago').filter(x=>x.prestamo===pid&&x.alloc&&x.alloc.some(a=>a.i===i)).forEach(x=>{const a=x.alloc.find(a=>a.i===i);x.alloc=x.alloc.filter(a=>a.i!==i);x.monto-=a.m;if(x.monto<=0.5&&!x.mora)x.del=true;put(x,true)});
  const m=mode==='ab'?Math.min(monto,c.v):c.v;const f=mode==='p'?c.f:(fecha||today());
  if(mode!=='n'&&m>0)put({id:uid(),k:'pago',prestamo:pid,fecha:f,monto:m,alloc:[{i,m}],pago:metodo||p.pago,manual:true},true);
  render();
}

function interesPart(p,monto){return p.total>0?monto*(p.total-p.monto)/p.total:0}

/* =============== cálculos: caja =============== */
function cajaStats(){
  const c=cfg()||{};const methods=(c.pagos&&c.pagos.length?c.pagos:['Efectivo']);const bal={};methods.forEach(m=>bal[m]=0);
  const addm=(m,v)=>{m=m||methods[0];bal[m]=(bal[m]||0)+v};
  addm(methods.includes('Efectivo')?'Efectivo':methods[0],c.caja0||0);
  items('compra').forEach(x=>addm(x.pago,-x.total));
  items('venta').forEach(x=>addm(x.pago,x.total-(x.gastos||0)));
  items('prestamo').forEach(x=>{if(!x.previas&&!x.cuaderno)addm(x.pago,-x.monto)});
  items('pago').forEach(x=>{if(!x.cuaderno)addm(x.pago,x.monto+(x.mora||0))});
  items('gasto').forEach(x=>addm(x.pago,-x.monto));
  items('cierre').forEach(x=>addm(x.metodo||methods[0],x.diff||0));
  const total=Object.values(bal).reduce((a,b)=>a+b,0);
  return {bal,total,methods}
}
function dayStats(d){
  const os=oroStats();const r={ventas:0,compras:0,cobros:0,cap:0,int:0,mora:0,prest:0,gastos:0,ganOro:0,gV:0,gC:0};
  items('venta').filter(x=>x.fecha===d).forEach(x=>{r.ventas+=x.total-(x.gastos||0);r.ganOro+=os.gan[x.id]||0;r.gV+=x.finos});
  items('compra').filter(x=>x.fecha===d).forEach(x=>{r.compras+=x.total;r.gC+=x.finos});
  items('pago').filter(x=>x.fecha===d&&!x.cuaderno).forEach(x=>{const p=S.items[x.prestamo];const it=p?interesPart(p,x.monto):0;r.cobros+=x.monto+(x.mora||0);r.int+=it;r.cap+=x.monto-it;r.mora+=x.mora||0});
  items('prestamo').filter(x=>x.inicio===d&&!x.previas&&!x.cuaderno).forEach(x=>r.prest+=x.monto);
  items('gasto').filter(x=>x.fecha===d).forEach(x=>r.gastos+=x.monto);
  r.entro=r.ventas+r.cobros;r.salio=r.compras+r.prest+r.gastos;r.gan=r.ganOro+r.int+r.mora-r.gastos;return r;
}

function waMsg(kind,cl,s,p){
  const c=cfg()||{};const tono=c.tono||'Amable';const nom=(cl.nombre||'').split(' ')[0];const neg=c.nombre||'';
  if(kind==='hoy'){const m=money(s.debeHoy||s.hoy?.v||p.cuota);
    if(tono==='Formal')return `Buen día, ${cl.nombre}. Le recordamos el pago de su cuota por ${m}, con vencimiento hoy. Atentamente, ${neg}.`;
    if(tono==='Directo')return `${nom}, hoy vence su cuota de ${m}. Quedo atento al pago.`;
    return `Buenos días, ${nom} 😊 Le recuerdo su cuota de ${m} de hoy. ¡Muchas gracias!`}
  if(kind==='atraso'){const m=money(s.atraso+s.mora);const n=s.vencidas;
    if(tono==='Formal')return `Buen día, ${cl.nombre}. Su préstamo presenta ${n} cuota(s) vencida(s) por un total de ${m}. Le agradecemos ponerse al día. ${neg}.`;
    if(tono==='Directo')return `${nom}, tiene ${n} cuota(s) atrasada(s): ${m}. Necesito el pago hoy, por favor.`;
    return `Hola, ${nom}. Le escribo porque tiene ${n} cuota(s) pendiente(s) por ${m}. ¿Me confirma cuándo puede ponerse al día? Gracias 🙏`}
  if(kind==='prox'){const m=money(s.next.st==='ab'?s.next.falta:s.next.v);const f=fdate(s.next.f);
    if(tono==='Formal')return `Buen día, ${cl.nombre}. Le recordamos que el ${f} vence su cuota por ${m}. ${neg}.`;
    if(tono==='Directo')return `${nom}, el ${f} vence su cuota de ${m}.`;
    return `Hola, ${nom} 😊 Le recuerdo que el ${f} vence su cuota de ${m}. ¡Gracias!`}
  if(kind==='recibo'){const x=p;return `🧾 *Recibo – ${neg}*\nCliente: ${cl.nombre}\nFecha: ${fdate(x.pago.fecha)}\nRecibido: ${money(x.pago.monto+(x.pago.mora||0))}${x.pago.mora?` (incluye mora ${money(x.pago.mora)})`:''}\nCuotas pagadas: ${x.s.pagadas} de ${x.loan.n}\nSaldo pendiente: ${money(x.s.saldo)}\n¡Gracias por su pago!`}
  return ''
}

/* =============== fechas de préstamos =============== */
function makeDates(first,frec,n,mode){
  if(mode===true)mode='todos';if(!mode)mode='sinfest';
  const out=[];const okDay=s=>mode==='todos'||(mode==='sindom'?pd(s).getDay()!==0:!isOff(s));
  const step=s=>frec==='Diario'?addDays(s,1):frec==='Semanal'?addDays(s,7):frec==='Quincenal'?addDays(s,15):(()=>{const x=pd(s);const day=pd(first).getDate();const nx=new Date(x.getFullYear(),x.getMonth()+1,1);const last=new Date(nx.getFullYear(),nx.getMonth()+1,0).getDate();nx.setDate(Math.min(day,last));return ymd(nx)})();
  let base=first;
  while(out.length<n){let f=base;if(frec==='Diario'){while(!okDay(f))f=addDays(f,1);out.push(f);base=addDays(f,1)}
    else{while(!okDay(f))f=addDays(f,1);out.push(f);base=step(base)}}
  return out;
}
function firstDue(frec){const t=today();return frec==='Diario'?addDays(t,1):frec==='Semanal'?addDays(t,7):frec==='Quincenal'?addDays(t,15):(()=>{const d=pd(t);d.setMonth(d.getMonth()+1);return ymd(d)})()}

  if(hoy.length)h+=`<div class="card">${hoy.map(x=>row(x,'hoy')).join('')}</div>`;

function cvCalc(){

function calendar(s,p){

  const mi=months.indexOf(cur);const [y,m]=cur.split('-').map(Number);const first=new Date(y,m-1,1);const days=new Date(y,m,0).getDate();
  const byDate={};s.cuotas.forEach(c=>byDate[c.f]=c);const off=(first.getDay()+6)%7;const t=today();

/* =============== nube (Firebase + cifrado) =============== */
const Cloud={on:false,err:'',db:null,key:null,fs:null,nid:null,ready:false,
  badge(){if(!S.me.cloud)return '';return `<button class="iconbtn" data-a="cloud" aria-label="Nube" style="color:${this.on?'var(--okt)':this.err?'var(--badt)':'var(--sub)'}">${ic('cloud')}</button>`},
  async push(it){if(!this.on)return;try{const e=await encObj(this.key,it);await this.fs.setDoc(this.fs.doc(this.db,'negocios',this.nid,'items',it.id),{iv:e.iv,ct:e.ct,ts:it.ts})}catch(e){this.err=e.message}},
  async start(){
    const c=S.me.cloud;if(!c||!c.config||!c.nid||!c.jwk)return;
    try{const V='10.12.2',B=`https://www.gstatic.com/firebasejs/${V}/`;
      const [A,Au,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
      const app=A.getApps().length?A.getApp():A.initializeApp(c.config);const auth=Au.getAuth(app);
      await new Promise(r=>{const u=Au.onAuthStateChanged(auth,()=>{u();r()})});
      if(!auth.currentUser){this.err='Vuelve a entrar a la nube (Más → Nube)';render();return}
      this.key=await crypto.subtle.importKey('jwk',c.jwk,{name:'AES-GCM'},false,['encrypt','decrypt']);
      this.db=F.getFirestore(app);this.fs=F;this.nid=c.nid;
      let first=true;
      F.onSnapshot(F.collection(this.db,'negocios',c.nid,'items'),async snap=>{
        const remote=new Set();let changed=false;
        for(const ch of snap.docChanges()){if(ch.type==='removed')continue;const d=ch.doc.data();remote.add(ch.doc.id);
          try{const it=await decObj(this.key,d);const loc=S.items[it.id];if(!loc||(it.ts||0)>(loc.ts||0)){S.items[it.id]=it;changed=true}}catch(e){this.err='No se pudo leer un dato: ¿la clave del negocio es la misma?'}}
        if(first){first=false;this.on=true;this.err='';for(const it of Object.values(S.items)){if(it&&it.id&&!remote.has(it.id))await this.push(it)}
          snap.docs.forEach(d=>{const loc=S.items[d.id];if(loc&&(loc.ts||0)>(d.data().ts||0))this.push(loc)})}
        if(changed){persist();if(!layer)render()}
      },e=>{this.on=false;this.err=e.message;render()});
    }catch(e){this.err=e.message;render()}
  }};
async function deriveKey(pass,nid){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:new TextEncoder().encode('oro-prestamos:'+nid),iterations:210000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['encrypt','decrypt']);return crypto.subtle.exportKey('jwk',k)}
async function encObj(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));return {iv:b64(iv),ct:b64(ct)}}
async function decObj(key,d){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(d.iv)},key,ub64(d.ct));return JSON.parse(new TextDecoder().decode(pt))}
function parseFbConfig(txt){const o={};for(const k of ['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId']){const m=txt.match(new RegExp(k+'["\']?\\s*[:=]\\s*["\']([^"\']+)["\']'));if(m)o[k]=m[1]}return o.apiKey&&o.projectId&&o.appId?o:null}
function sheetCloud(){
  const c=S.me.cloud||{};
  layer=`<div class="dim" data-a="close"></div><div class="sheet"><div class="grab"></div><h2>${ic('cloud')}Nube entre socios</h2>
  ${Cloud.on?`<div class="banner">${ic('cobra')}<span><b>Conectada.</b> Todo se cifra en este celular antes de subir. Ni NEXO PC ni Google pueden leerlo.</span></div>`:Cloud.err?`<div class="banner" style="border-color:var(--mal)"><span class="bad">${esc(Cloud.err)}</span></div>`:''}
  <p class="sub" style="margin-bottom:10px">NEXO PC hace esta configuración el día de la instalación. Los dos celulares deben usar el mismo <b>código del negocio</b> y la misma <b>clave</b>.</p>
  <form id="fcloud"><label class="field"><span>Configuración de Firebase (pegar)</span><textarea name="config" placeholder="apiKey: &quot;…&quot;, authDomain: …, projectId: …, appId: …">${c.config?esc(JSON.stringify(c.config)):''}</textarea></label>
  <label class="field"><span>Código del negocio</span><input name="nid" value="${esc(c.nid||'')}" placeholder="ej. oro-capital" autocapitalize="off"></label>
  <label class="field"><span>Correo de este socio</span><input name="email" type="email" value="${esc(c.email||'')}" autocapitalize="off"></label>
  <label class="field"><span>Contraseña de la nube</span><input name="pass" type="password" placeholder="No se guarda en el celular"></label>
  <label class="field"><span>Clave del negocio (para cifrar)</span><input name="clave" type="password" placeholder="Igual en los dos celulares"></label>
  <div class="sub" style="margin:-2px 2px 10px">⚠ Escriban la clave en papel y guárdenla. Sin ella, nadie puede recuperar los datos.</div>
  <button class="bigbtn a-presta" type="submit">${ic('cloud')}Conectar</button>
  ${S.me.cloud?`<button type="button" class="bigbtn a-ver" data-a="clouddisc">Desconectar este celular</button>`:''}</form></div>`;render();
}
async function saveCloud(f){
  if(S.me.demo){toast('Primero borra los datos de prueba: ⚙ → Empezar de cero');return}
  const config=parseFbConfig(f.config.value);if(!config){toast('La configuración de Firebase no es válida');return}
  const nid=f.nid.value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-');const email=f.email.value.trim();
  if(!nid||!email||!f.pass.value||f.clave.value.length<6){toast('Llena todo. La clave debe tener mínimo 6 caracteres');return}
  toast('Conectando…');
  try{const B='https://www.gstatic.com/firebasejs/10.12.2/';const [A,Au]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js')]);
    const app=A.getApps().length?A.getApp():A.initializeApp(config);const auth=Au.getAuth(app);
    try{await Au.signInWithEmailAndPassword(auth,email,f.pass.value)}catch(e){if(e.code==='auth/user-not-found'||e.code==='auth/invalid-credential'){try{await Au.createUserWithEmailAndPassword(auth,email,f.pass.value)}catch(e2){throw e}}else throw e}
    const jwk=await deriveKey(f.clave.value,nid);S.me.cloud={config,nid,email,jwk};persist();layer='';render();await Cloud.start();toast(Cloud.on?'Nube conectada':'Conectando la nube…')}
  catch(e){toast('No se pudo conectar: '+(e.code||e.message))}
}

}
function sheetPlus(){layer=`<div class="dim" data-a="close"></div><div class="sheet"><div class="grab"></div><h2 style="justify-content:center">¿Qué vas a hacer?</h2><div class="acts">
  <button class="act a-compra" data-a="compra">${ic('compra')}Comprar oro</button><button class="act a-venta" data-a="venta">${ic('venta')}Vender oro</button>
  <button class="act a-presta" data-a="prestar">${ic('presta')}Prestar</button><button class="act a-cobra" data-a="cobrarpick">${ic('cobra')}Cobrar</button>
  <button class="act a-mal" data-a="gasto">${ic('gasto')}Gasto</button><button class="act a-recor" data-a="recs">${ic('recor')}Recordatorio</button></div></div>`;render()}
function sheetPickCobro(){const la=loansActive().sort((a,b)=>(b.s.atraso>0)-(a.s.atraso>0)||(b.s.debeHoy>0)-(a.s.debeHoy>0)||a.cl.nombre.localeCompare(b.cl.nombre));
  layer=`<div class="dim" data-a="close"></div><div class="sheet"><div class="grab"></div><h2 style="color:var(--cobra)">${ic('cobra')}¿A quién le cobras?</h2><div class="card">${la.map(x=>`<button class="pp" data-a="cobrar" data-v="${x.p.id}"><span class="ini">${esc(initials(x.cl.nombre))}</span><span class="t"><b>${esc(x.cl.nombre)}</b><span class="sub">${x.s.atraso>.5?'Atrasado '+money(x.s.atraso):x.s.debeHoy>0?'Hoy '+money(x.s.debeHoy):'Al día · debe '+money(x.s.saldo)}</span></span>${x.s.atraso>.5?'<span class="chip c-mal">Tarde</span>':x.s.debeHoy>0?'<span class="chip c-hoy">Hoy</span>':''}</button>`).join('')||'<div class="empty">No hay préstamos activos</div>'}</div></div>`;render()}
function sheetEditCl(id){const cl=S.items[id];layer=`<div class="dim" data-a="close"></div><div class="sheet"><div class="grab"></div><h2>${ic('editar')}Datos del cliente</h2><form id="fcl" data-id="${id}">
  ${[['nombre','Nombre'],['cel','Celular (WhatsApp)'],['cedula','Cédula'],['dir','Dirección'],['codeudor','Codeudor'],['notas','Notas']].map(([k,l])=>`<label class="field"><span>${l}</span><input name="${k}" value="${esc(cl[k]||'')}"></label>`).join('')}
  <button class="bigbtn a-ver" type="submit">Guardar</button></form></div>`;render()}
function sheetSecurity(){layer=`<div class="dim" data-a="close"></div><div class="sheet"><div class="grab"></div><h2>${ic('face')}PIN y Face ID</h2>
  <form id="fpin"><label class="field"><span>Nuevo PIN (4 números)</span><input name="pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*"></label><button class="bigbtn a-ver" type="submit">Cambiar PIN</button></form>
  ${faceOK()?(S.me.face?`<button class="bigbtn a-ver" data-a="faceoff">Quitar Face ID</button>`:`<button class="bigbtn a-presta" data-a="faceon">${ic('face')}Activar Face ID</button><p class="sub" style="margin-top:8px">El iPhone guardará una llave para esta app. Después, a veces te pedirá Face ID y a veces el PIN.</p>`):'<p class="sub" style="margin-top:10px">Face ID funciona cuando la app está publicada (https) e instalada en el iPhone.</p>'}
  <button class="bigbtn" data-a="lock" style="color:var(--sub)">Bloquear ahora</button></div>`;render()}
function sheetBackup(){layer=`<div class="dim" data-a="close"></div><div class="sheet"><div class="grab"></div><h2>${ic('caja')}Copia de seguridad</h2>
  <p class="sub" style="margin-bottom:10px">Guarda un archivo con todo. Si cambian de celular o se borra Safari, lo recuperan desde aquí.</p>
  <button class="bigbtn a-enviar" data-a="export">${ic('enviar')}Guardar copia</button>
  <label class="bigbtn a-ver" style="cursor:pointer">${ic('refresh')}Recuperar desde archivo<input type="file" accept=".json,application/json" id="impfile" style="display:none"></label></div>`;render()}

/* =============== eventos =============== */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,v=el.dataset.v;
  if(el.tagName==='INPUT'&&el.type==='checkbox'&&a!=='rechecho')return;
  switch(a){
    case 'wzstart':startWizard(false);break;
    case 'wzedit':layer='';startWizard(true);break;
    case 'wzclose':W=null;S.me.view='mas';render();break;
    case 'wzback':if(W.i>0){W.i--;render();scrollTo(0,0)}else{const ed=W.edit;W=null;S.me.view=ed?'mas':'inicio';render()}break;
    case 'wznext':wzNext();break;
    case 'wzopt':{const q=WZ.flatMap(s=>s.qs).find(x=>x.id===el.dataset.q);
      if(q.multi){let arr=W.a[q.id]||[];if(arr.includes(v))arr=arr.filter(x=>x!==v);else{if(q.max&&arr.length>=q.max)arr.shift();arr.push(v)}W.a[q.id]=arr;
        el.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',arr.includes(b.dataset.v)))}
      else{W.a[q.id]=W.a[q.id]===v?'':v;el.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===W.a[q.id]))}break}
    case 'demo':loadDemo();break;
    case 'join':sheetCloud();break;
    case 'joinyo':S.me.yo=+v;el.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));break;
    case 'tab':layer='';S.me.view=v;persist();render();scrollTo(0,0);break;
    case 'plus':if(!canEdit()){toast('Este celular solo puede ver');break}sheetPlus();break;
    case 'close':layer='';render();break;
    case 'compra':case 'venta':if(!gram24()&&!cfg().manualPx){toast('Sin precio del oro: pon el precio a mano en el campo');}sheetCompraVenta(a);break;
    case 'mov':if(canEdit())sheetCompraVenta(S.items[v].k,S.items[v]);break;
    case 'delmov':if(confirm('¿Borrar este movimiento?')){const it=S.items[v];layer='';del(v,`${it.k} de ${grams(it.finos)}`);toast('Borrado')}break;
    case 'adj':{const f=$('#fcv');const g=gram24();if(!g){const p=intv(f.precio.value);f.precio.value=thou(Math.round(p*(1+(+v)/100)/100)*100)}else{const cur=intv(f.precio.value)/g*100;f.precio.value=thou(Math.round(g*(Math.round(cur)+(+v))/100/100)*100)}cvCalc();break}
    case 'purmode':{const f=$('#fcv');f.ley.dataset.k=v==='k'?'1':'0';$('#purl').textContent=v==='k'?'Quilates':'Ley';f.ley.placeholder=v==='k'?'18':'0,90';f.ley.value='';el.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));cvCalc();break}
    case 'prestar':sheetPrestar();break;
    case 'frec':{const f=$('#fp');f.frec.value=v;el.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));f.n.value=v==='Diario'?24:v==='Semanal'?10:v==='Quincenal'?6:4;f.first.value=firstDue(v);pCalc();break}
    case 'dias':{const f=$('#fp');f.dias.value=v;el.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));pCalc();break}
    case 'cuad':{const f=$('#fp');const i=+el.dataset.i;const cur=f._cm[i]||'p';f._cm[i]=cur==='p'?'t':cur==='t'?'n':'p';cuadRender(f);break}
    case 'cuadall':{const f=$('#fp');f._calc.fechas.forEach((d,i)=>f._cm[i]=v);cuadRender(f);break}
    case 'fixmode':{const f=$('#ffix');f.mode.value=v;el.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));fixExtra();break}
    case 'cobrar1':sheetCobrar(v,+el.dataset.i);break;
    case 'csel':{const f=$('#fcob');const i=+el.dataset.i;if(f._sel.has(i))f._sel.delete(i);else f._sel.add(i);cobCalc(true);break}
    case 'authface':{if(await faceVerify())authOK();else toast('No se pudo con Face ID: usa el PIN');break}
    case 'cliente':layer='';S.me.view='cliente';S.me.loan=v;S.me.calm=null;persist();render();scrollTo(0,0);break;
    case 'pf':S.me.pf=v;render();break;
    case 'calm':if(v){S.me.calm=v;render()}break;
    case 'cuota':sheetCuota(v,+el.dataset.i);break;
    case 'mvcuota':{const p=S.items[v];const nd=$('#mvdate').value;const i=+el.dataset.i;if(nd)withLock(()=>{materialize(p);p.fechas=p.fechas.slice();p.fechas[i]=nd;layer='';put(p);toast('Fecha cambiada')});break}
    case 'cobrarpick':sheetPickCobro();break;
    case 'cobrar':sheetCobrar(v);break;
    case 'ncuo':{const f=$('#fcob');const p=S.items[f.dataset.p];const pend=loanStatus(p).cuotas.filter(x=>x.st!=='p'&&x.st!=='t');const n=Math.max(1,Math.min(pend.length,f._sel.size+(+v)));f._sel=new Set(pend.slice(0,n).map(x=>x.i));cobCalc(true);break}
    case 'wa':{const p=S.items[v];const cl=S.items[p.cliente];const s=loanStatus(p);if(el.dataset.k==='prox'&&!s.next){toast('No tiene cuotas pendientes');break}if(!cl.cel){toast('Este cliente no tiene celular guardado');}waOpen(cl.cel,waMsg(el.dataset.k,cl,s,p));break}
    case 'recibo':{const p=S.items[v];const s=loanStatus(p);const last=s.pagos[s.pagos.length-1];if(!last){toast('Aún no hay pagos para el recibo');break}const cl=S.items[p.cliente];waOpen(cl.cel,waMsg('recibo',cl,s,{pago:last,s,loan:p}));break}
    case 'sendrecibo':{const pg=S.items[v];const p=S.items[pg.prestamo];const cl=S.items[p.cliente];const s=loanStatus(p);layer='';render();waOpen(cl.cel,waMsg('recibo',cl,s,{pago:pg,s,loan:p}));break}
    case 'delpago':withLock(()=>{if(confirm('¿Borrar este pago?')){const pg=S.items[v];layer='';del(v,`pago de ${money(pg.monto)}`)}else render()});break;
    case 'delloan':withLock(()=>{layer='';if(confirm('¿Borrar este préstamo y sus pagos?')){items('pago').filter(x=>x.prestamo===v).forEach(x=>{x.del=true;put(x,true)});del(v,'un préstamo');S.me.view='prestamos'}render()});break;
    case 'editcl':sheetEditCl(v);break;
    case 'gasto':sheetGasto();break;
    case 'gcat':{const f=$('#fg');f.desc.value=v==='Otro'?'':v;el.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));break}
    case 'delgasto':if(confirm('¿Borrar este gasto?'))del(v,'un gasto');break;
    case 'contar':sheetContar();break;
    case 'contarcaja':sheetContarCaja();break;
    case 'ccm':{const f=$('#fcc');f.metodo.value=v;el.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));$('#ccdeb').textContent=money(cajaStats().bal[v]||0);break}
    case 'recs':sheetRecs();break;
    case 'recpara':{const f=$('#frec');f.para.value=v;el.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));break}
    case 'rechecho':{const r=S.items[v];r.hecho=true;put(r,true);setTimeout(sheetRecs,250);break}
    case 'rp':S.me.rp=v;render();break;
    case 'pdf':printReport();break;
    case 'px':refreshPx(true);break;
    case 'colors':showColors(false);break;
    case 'pxmanual':{const c=cfg();const r=prompt('Precio del gramo de oro 24k en pesos (déjalo vacío para usar el internacional):',c.manualPx?thou(c.manualPx):'');if(r!==null){c.manualPx=intv(r)||0;put(c)}break}
    case 'security':sheetSecurity();break;
    case 'faceon':await faceRegister();sheetSecurity();break;
    case 'faceoff':S.me.face=null;persist();sheetSecurity();break;
    case 'lock':layer='';S.me.unlocked=false;chooseLockMode();render();break;
    case 'faceid':faceCheck();break;
    case 'usepin':S.me.lockMode='pin';render();break;
    case 'useface':S.me.lockMode='face';render();faceCheck();break;
    case 'pin':{if(v==='x')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=v;
      if(pinBuf.length===4){if(pinBuf===S.me.pin){unlock();break}const d=$('#dots');pinBuf='';render();const d2=$('#dots');d2&&d2.classList.add('shake');break}render();break}
    case 'cloud':sheetCloud();break;
    case 'clouddisc':if(confirm('¿Desconectar la nube en este celular? Los datos se quedan aquí.')){S.me.cloud=null;Cloud.on=false;persist();layer='';render()}break;
    case 'backup':sheetBackup();break;
    case 'export':{const data=JSON.stringify({app:'oro-prestamos',v:1,fecha:new Date().toISOString(),items:S.items},null,1);const name=`copia-${(cfg().nombre||'oro').toLowerCase().replace(/\W+/g,'-')}-${today()}.json`;
      const file=new File([data],name,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name})}catch(e){}}else{const u=URL.createObjectURL(file);const l=document.createElement('a');l.href=u;l.download=name;l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}break}
    case 'reset':if(confirm(S.me.demo?'¿Borrar los datos de prueba y configurar tu negocio?':'¿Borrar TODO en este celular? Haz una copia antes.')){S={v:1,items:{},me:{px:S.me.px,pxh:S.me.pxh}};persist();layer='';render()}break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.money){const pos=t.value.length-t.selectionStart;const n=intv(t.value);t.value=n?thou(n):'';try{const p=Math.max(0,t.value.length-pos);t.setSelectionRange(p,p)}catch(_){}}
  if(t.dataset.w!==undefined&&W){W.a[t.dataset.w]=t.dataset.money?intv(t.value):t.value}
  if(t.dataset.wo!==undefined&&W){W.a[t.dataset.wo+'Val']=t.value}
  if(t.closest('#fcv'))cvCalc();
  if(t.closest('#fp'))pCalc();
  if(t.closest('#fcob')){if(t.name==='monto'||t.name==='mora')cobCalc(false)}
  if(t.dataset.a2==='pq'){S.me.pq=t.value;const pos=t.selectionStart;render();const x=document.querySelector('[data-a2=pq]');if(x){x.focus();x.setSelectionRange(pos,pos)}}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.a2==='cajad'){S.me.cajad=t.value||today();render()}
  if(t.closest('#fp'))pCalc();if(t.closest('#fcv'))cvCalc();
  if(t.id==='impfile'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=='oro-prestamos'||!d.items)throw 0;if(!confirm('¿Reemplazar los datos de este celular con la copia?'))return;
    S.items=d.items;S.me.demo=false;persist();layer='';render();toast('Copia recuperada');Object.values(S.items).forEach(it=>Cloud.push(it))}catch(_){toast('Ese archivo no es una copia válida')}};r.readAsText(t.files[0])}
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
  if(f.id==='fcv')saveCV(f);
  else if(f.id==='fp')savePrestamo(f);
  else if(f.id==='fcob')saveCobro(f);
  else if(f.id==='fg'){const m=intv(f.monto.value);if(!m){toast('Escribe el valor');return}layer='';put({id:uid(),k:'gasto',fecha:f.fecha.value||today(),monto:m,desc:f.desc.value.trim(),pago:f.pago.value});toast('Gasto guardado')}
  else if(f.id==='fct'){const g=num(f.g.value);const os=oroStats();if(!g&&g!==0){return}
    put({id:uid(),k:'conteo',fecha:today(),g,esperado:os.g},true);
    if(f.ajustar.checked&&Math.abs(g-os.g)>0.001){const c=cfg();c.oro0g=(c.oro0g||0)+(g-os.g);if(c.oro0g<0)c.oro0g=0;put(c,true)}
    layer='';render();toast('Conteo guardado')}
  else if(f.id==='fcc'){const contado=intv(f.contado.value);const cs=cajaStats();const deb=cs.bal[f.metodo.value]||0;layer='';put({id:uid(),k:'cierre',fecha:today(),metodo:f.metodo.value,contado,esperado:deb,diff:contado-deb});toast(contado===deb?'¡Cuadró perfecto!':'Diferencia guardada: '+money(contado-deb))}
  else if(f.id==='frec'){const tx=f.texto.value.trim();if(!tx)return;put({id:uid(),k:'rec',texto:tx,para:f.para.value,de:S.me.yo??0,cuando:f.cuando.value,hecho:false},true);sheetRecs();toast('Recordatorio guardado')}
  else if(f.id==='fcl'){const cl=S.items[f.dataset.id];['nombre','cel','cedula','dir','codeudor','notas'].forEach(k=>cl[k]=f[k].value.trim());layer='';put(cl);toast('Datos guardados')}
  else if(f.id==='fpin'){if(!/^\d{4}$/.test(f.pin.value)){toast('El PIN debe tener 4 números');return}S.me.pin=f.pin.value;persist();toast('PIN cambiado');layer='';render()}
  else if(f.id==='fcloud')saveCloud(f);
  else if(f.id==='fauth'){if(f.pin.value===S.me.pin)authOK();else{toast('PIN incorrecto');f.pin.value=''}}
  else if(f.id==='ffix'){const mode=f.mode.value,pid=f.dataset.p,i=+f.dataset.i;const fecha=f.fecha?f.fecha.value:'';const monto=f.monto?intv(f.monto.value):0;const met=f.metodo?f.metodo.value:'';
    if(mode==='ab'&&!monto){toast('Escribe cuánto abonó');return}
    withLock(()=>{setCuota(pid,i,mode,fecha,monto,met);layer='';render();toast('Cuota corregida')})}
  else if(f.id==='fjoin'){if(S.me.yo===undefined||S.me.yo===null||S.me.yo<0){toast('Escoge quién eres');return}if(!/^\d{4}$/.test(f.pin.value)){toast('El PIN debe tener 4 números');return}S.me.pin=f.pin.value;S.me.unlocked=true;S.me.view='inicio';persist();render();setTimeout(()=>showColors(true),300)}
});

/* =============== arranque =============== */
if(S.me.pin&&cfg()){S.me.unlocked=false;chooseLockMode()}
if(S.me.view==='wz')S.me.view='inicio';
render();
refreshPx();setInterval(()=>{if(!document.hidden)refreshPx()},15*60e3);
Cloud.start();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').then(r=>{r.addEventListener('updatefound',()=>{const w=r.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast('Hay una versión nueva: cierra y abre la app')})})}).catch(()=>{})}
</script>
</body>
