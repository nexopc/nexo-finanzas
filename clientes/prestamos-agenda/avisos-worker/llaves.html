<!doctype html>
<html lang="es-CO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Llaves de avisos · NEXO PC</title>
<style>body{font:16px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;max-width:720px;margin:0 auto;padding:24px 16px;background:#0F0D0A;color:#F5EFE2}
h1{font-size:22px}button{font:inherit;font-weight:700;background:#E0A526;color:#1E1400;border:0;border-radius:12px;padding:12px 18px;cursor:pointer}
label{display:block;margin-top:18px;font-weight:700}textarea{width:100%;box-sizing:border-box;background:#1B1813;color:#F1D58E;border:1px solid #352F25;border-radius:10px;padding:10px;font:13px/1.4 ui-monospace,Consolas,monospace;min-height:70px}
p{color:#B3AA96}.c{background:#26221B;border:0;color:#F5EFE2;padding:6px 12px;font-size:14px;margin-top:6px}</style></head>
<body><h1>Llaves para los avisos de "Cobros y Agenda"</h1>
<p>Ábrelo en tu PC (Chrome o Edge). Toca el botón <b>una sola vez</b> y guarda las 2 llaves en un lugar seguro. Si las cambias después, hay que volver a activar los avisos en el iPhone.</p>
<button id="go">Crear llaves</button>
<label>1 · VAPID_PUBLIC (clave pública: va en Cloudflare y en la app)</label><textarea id="pub" readonly></textarea><button class="c" data-t="pub">Copiar</button>
<label>2 · VAPID_PRIVATE_JWK (clave privada: SOLO en Cloudflare, como secreto)</label><textarea id="priv" readonly></textarea><button class="c" data-t="priv">Copiar</button>
<p>La privada nunca se sube a GitHub ni se manda por WhatsApp.</p>
<script>
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
document.getElementById('go').onclick=async()=>{const k=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
 document.getElementById('pub').value=b64u(await crypto.subtle.exportKey('raw',k.publicKey));
 const j=await crypto.subtle.exportKey('jwk',k.privateKey);delete j.key_ops;delete j.ext;document.getElementById('priv').value=JSON.stringify(j)};
document.querySelectorAll('.c').forEach(b=>b.onclick=()=>{const t=document.getElementById(b.dataset.t);t.select();navigator.clipboard.writeText(t.value);b.textContent='Copiado ✓'});
</script></body></html>
